<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1220">
<title>循迹与机械臂仿真实验台</title>
<style>
:root{
  --bg:#07101d;--panel:#0e1929;--panel2:#121f33;--line:#24344c;--text:#edf4ff;
  --muted:#8ea0b8;--accent:#5aa7ff;--accent2:#7ad8ff;--ok:#4bd18b;--warn:#ffcc66;
  --road:#e8edf3;--black:#101419;--metal:#dce5ee;--metal2:#97a8ba;--orange:#f2a03d
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:linear-gradient(180deg,#07101d,#0a1422 55%,#07101d);color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;overflow:hidden}
button,textarea{font:inherit}
.app{height:100%;display:grid;grid-template-rows:58px 1fr}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #1b2a40;background:rgba(7,16,29,.88);backdrop-filter:blur(14px)}
.brand{display:flex;gap:11px;align-items:center;font-weight:750;letter-spacing:.2px}
.logo{width:31px;height:31px;border:1px solid #2a4767;border-radius:9px;display:grid;place-items:center;background:linear-gradient(145deg,#14243b,#0d1828);box-shadow:inset 0 0 20px #102944}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:11px;margin-top:1px}
.status{display:flex;gap:8px;align-items:center;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 12px #4bd18b}
.main{min-height:0;display:grid;grid-template-columns:minmax(430px,1.25fr) minmax(380px,.75fr);gap:12px;padding:12px}
.panel{min-height:0;border:1px solid #1f3048;border-radius:14px;background:linear-gradient(180deg,rgba(18,31,51,.96),rgba(11,22,38,.96));box-shadow:0 16px 50px rgba(0,0,0,.24);overflow:hidden}
.simPanel{display:grid;grid-template-rows:48px 1fr 104px}
.panelHead{display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #203149}
.panelTitle{font-weight:700}
.toolbar{display:flex;gap:7px}
.btn{border:1px solid #2a3d59;background:#12213a;color:#dce9fa;border-radius:8px;padding:7px 10px;cursor:pointer}
.btn:hover{background:#182b48}
.btn.primary{background:#1767c6;border-color:#2f84e6;color:white}
.btn.danger{background:#472029;border-color:#73313d}
.stageWrap{position:relative;min-height:0;background:#07111d}
canvas{width:100%;height:100%;display:block}
.overlay{position:absolute;left:12px;top:12px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
.pill{padding:6px 9px;border-radius:8px;background:rgba(8,17,30,.78);border:1px solid rgba(70,100,139,.5);color:#dce8f8;font-size:12px;backdrop-filter:blur(8px)}
.bottomInfo{display:grid;grid-template-columns:1fr 1fr 1.2fr;border-top:1px solid #203149;background:#0c1829}
.infoBox{padding:10px 12px;border-right:1px solid #203149}
.infoBox:last-child{border-right:0}
.label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}
.value{font-size:18px;font-weight:760;margin-top:4px}
.sensorRow{display:flex;gap:6px;margin-top:6px}
.sensor{width:28px;height:28px;border-radius:7px;border:1px solid #3a4b60;background:#e7edf5;color:#0d1118;display:grid;place-items:center;font-weight:800}
.sensor.on{background:#101419;color:white;border-color:#69798d;box-shadow:0 0 0 1px rgba(255,255,255,.05) inset}
.side{display:grid;grid-template-rows:minmax(320px,.9fr) minmax(260px,1.1fr);gap:12px;min-height:0}
.armPanel{display:grid;grid-template-rows:46px 1fr}
.armArea{position:relative;min-height:0}
.armHud{position:absolute;right:12px;top:12px;display:grid;gap:5px;font-size:11px;color:var(--muted);text-align:right}
.editorPanel{display:grid;grid-template-rows:46px 1fr 46px;min-height:0}
.editorTop{display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid #203149}
.editorMeta{font-size:11px;color:var(--muted)}
textarea{width:100%;height:100%;resize:none;border:0;outline:0;padding:14px 15px;background:#07111d;color:#d9e8fb;font:13px/1.55 "Cascadia Code","SFMono-Regular",Consolas,monospace;tab-size:2}
.editorFoot{display:flex;align-items:center;justify-content:space-between;padding:0 10px;border-top:1px solid #203149;background:#0c1829}
.console{color:#8fa4bc;font:11px/1.3 "Cascadia Code",Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.kbd{color:#8fa4bc;font-size:11px}
@media (max-width:980px){
 body{overflow:auto}.app{height:auto;min-height:100%}.main{grid-template-columns:1fr}.simPanel{height:690px}.side{grid-template-rows:420px 480px}.topbar{position:sticky;top:0;z-index:10}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo">⚙</div>
      <div>循迹与机械臂仿真实验台<small>ESP32 · 4路灰度传感器 · 四舵机机械臂</small></div>
    </div>
    <div class="status"><span class="dot"></span><span id="runState">仿真就绪</span></div>
  </header>

  <main class="main">
    <section class="panel simPanel">
      <div class="panelHead">
        <div class="panelTitle">赛道仿真</div>
        <div class="toolbar">
          <button class="btn" id="resetBtn">复位</button>
          <button class="btn primary" id="startBtn">开始</button>
          <button class="btn danger" id="stopBtn">停止</button>
        </div>
      </div>
      <div class="stageWrap">
        <canvas id="trackCanvas"></canvas>
        <div class="overlay">
          <div class="pill">初始：中间双黑 → <b>0110</b></div>
          <div class="pill">交叉线：全黑 → <b>1111</b></div>
          <div class="pill">地图已清理：无漂浮红块</div>
        </div>
      </div>
      <div class="bottomInfo">
        <div class="infoBox">
          <div class="label">灰度传感器</div>
          <div class="sensorRow" id="sensorRow"></div>
        </div>
        <div class="infoBox">
          <div class="label">当前返回值</div>
          <div class="value" id="sensorValue">0110</div>
        </div>
        <div class="infoBox">
          <div class="label">车辆状态</div>
          <div class="value" id="carState">赛道中心 · 静止</div>
        </div>
      </div>
    </section>

    <div class="side">
      <section class="panel armPanel">
        <div class="panelHead"><div class="panelTitle">机械臂实时模型</div><div class="editorMeta">按代码中的 servo.write() 动作</div></div>
        <div class="armArea">
          <canvas id="armCanvas"></canvas>
          <div class="armHud">
            <span>旋转 GPIO14：<b id="vRot">90°</b></span>
            <span>夹爪 GPIO27：<b id="vGrip">145°</b></span>
            <span>左臂 GPIO26：<b id="vLeft">100°</b></span>
            <span>右臂 GPIO25：<b id="vRight">110°</b></span>
          </div>
        </div>
      </section>

      <section class="panel editorPanel">
        <div class="editorTop">
          <div class="panelTitle">你的代码</div>
          <div class="editorMeta">初始代码已清空 · 支持常见 Servo write / delay</div>
        </div>
        <textarea id="code" spellcheck="false" placeholder="// 在这里输入你的 ESP32 / Arduino 代码&#10;// 例如：zhua.write(150);&#10;//      left.write(95);&#10;//      delay(1000);"></textarea>
        <div class="editorFoot">
          <div class="console" id="console">等待输入代码…</div>
          <div>
            <span class="kbd">Ctrl / ⌘ + Enter</span>
            <button class="btn primary" id="runCodeBtn">运行代码</button>
          </div>
        </div>
      </section>
    </div>
  </main>
</div>

<script>
(() => {
  const track = document.getElementById('trackCanvas');
  const tctx = track.getContext('2d');
  const arm = document.getElementById('armCanvas');
  const actx = arm.getContext('2d');
  const sensorRow = document.getElementById('sensorRow');
  const sensorValue = document.getElementById('sensorValue');
  const carState = document.getElementById('carState');
  const runState = document.getElementById('runState');
  const codeEl = document.getElementById('code');
  const consoleEl = document.getElementById('console');

  let running = false;
  let last = performance.now();
  let progress = 0.02;
  let lateral = 0;
  let carSpeed = 0.050;
  let sensors = [0,1,1,0];

  const servos = { zhuan:90, zhua:145, left:100, right:110 };
  const servoPins = {14:'zhuan',27:'zhua',26:'left',25:'right'};

  for(let i=0;i<4;i++){
    const e=document.createElement('div'); e.className='sensor'+(sensors[i]?' on':''); e.textContent=sensors[i];
    sensorRow.appendChild(e);
  }

  function fit(c,ctx){
    const r=c.getBoundingClientRect(), d=Math.min(2,devicePixelRatio||1);
    const w=Math.max(10,Math.floor(r.width*d)), h=Math.max(10,Math.floor(r.height*d));
    if(c.width!==w||c.height!==h){c.width=w;c.height=h}
    ctx.setTransform(d,0,0,d,0,0);
    return {w:r.width,h:r.height};
  }

  function roundedRect(ctx,x,y,w,h,r){
    const rr=Math.min(r,w/2,h/2);
    ctx.beginPath();ctx.moveTo(x+rr,y);ctx.arcTo(x+w,y,x+w,y+h,rr);ctx.arcTo(x+w,y+h,x,y+h,rr);ctx.arcTo(x,y+h,x,y,rr);ctx.arcTo(x,y,x+w,y,rr);ctx.closePath()
  }

  function trackPoint(p,w,h){
    const cx=w*.47, cy=h*.52, rx=w*.35, ry=h*.32;
    const a = p*Math.PI*2;
    // flattened rounded-rectangle style loop
    return {x:cx+Math.cos(a)*rx, y:cy+Math.sin(a)*ry};
  }
  function tangent(p,w,h){
    const a=p*Math.PI*2, rx=w*.35, ry=h*.32;
    let dx=-Math.sin(a)*rx, dy=Math.cos(a)*ry; const l=Math.hypot(dx,dy)||1;
    return {x:dx/l,y:dy/l};
  }

  function drawTrack(){
    const {w,h}=fit(track,tctx); tctx.clearRect(0,0,w,h);
    const g=tctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#0d1a2a');g.addColorStop(1,'#08121e');tctx.fillStyle=g;tctx.fillRect(0,0,w,h);
    // floor grid
    tctx.strokeStyle='rgba(91,122,158,.10)';tctx.lineWidth=1;
    for(let x=0;x<w;x+=34){tctx.beginPath();tctx.moveTo(x,0);tctx.lineTo(x,h);tctx.stroke()}
    for(let y=0;y<h;y+=34){tctx.beginPath();tctx.moveTo(0,y);tctx.lineTo(w,y);tctx.stroke()}

    const cx=w*.47, cy=h*.52, rw=w*.72, rh=h*.66;
    tctx.save();
    tctx.strokeStyle='#e7ecf1';tctx.lineWidth=Math.max(58,Math.min(86,w*.07));tctx.lineJoin='round';
    roundedRect(tctx,cx-rw/2,cy-rh/2,rw,rh,Math.min(rw,rh)*.28);tctx.stroke();
    tctx.strokeStyle='#101419';tctx.lineWidth=Math.max(13,Math.min(20,w*.018));
    roundedRect(tctx,cx-rw/2,cy-rh/2,rw,rh,Math.min(rw,rh)*.28);tctx.stroke();
    // cross line at bottom
    const crossX=cx, crossY=cy+rh/2;
    tctx.strokeStyle='#101419';tctx.lineWidth=18;tctx.beginPath();tctx.moveTo(crossX-55,crossY);tctx.lineTo(crossX+55,crossY);tctx.stroke();
    // parking box
    tctx.fillStyle='#f4f7fa';tctx.fillRect(cx-43,cy-43,86,86);
    tctx.strokeStyle='#101419';tctx.lineWidth=5;tctx.strokeRect(cx-43,cy-43,86,86);
    tctx.fillStyle='#33465f';tctx.font='600 12px system-ui';tctx.textAlign='center';tctx.fillText('停车区',cx,cy+4);
    tctx.restore();

    // vehicle
    const p=trackPoint(progress,w,h), tv=tangent(progress,w,h), nv={x:-tv.y,y:tv.x};
    const x=p.x+nv.x*lateral,y=p.y+nv.y*lateral,ang=Math.atan2(tv.y,tv.x);
    drawCar(x,y,ang,w,h);
  }

  function drawCar(x,y,a,w,h){
    tctx.save();tctx.translate(x,y);tctx.rotate(a);
    // shadow
    tctx.fillStyle='rgba(0,0,0,.28)';roundedRect(tctx,-41,-24,88,53,10);tctx.fill();
    // wheels
    tctx.fillStyle='#05080d';
    [[-27,-27],[24,-27],[-27,22],[24,22]].forEach(([wx,wy])=>{roundedRect(tctx,wx-10,wy-5,20,10,4);tctx.fill()});
    // longer chassis
    const cg=tctx.createLinearGradient(-40,0,40,0);cg.addColorStop(0,'#26384d');cg.addColorStop(.5,'#4a6179');cg.addColorStop(1,'#26384d');
    tctx.fillStyle=cg;roundedRect(tctx,-43,-21,86,42,8);tctx.fill();tctx.strokeStyle='#6f859b';tctx.lineWidth=1;tctx.stroke();
    // electronics deck
    tctx.fillStyle='#163b59';roundedRect(tctx,-19,-17,38,34,5);tctx.fill();
    tctx.fillStyle='#2b6f92';for(let i=-12;i<=12;i+=8)tctx.fillRect(i,-11,3,22);
    // battery
    tctx.fillStyle='#b9c7d3';roundedRect(tctx,-36,-13,14,26,3);tctx.fill();
    // front sensor bar
    tctx.fillStyle='#111820';roundedRect(tctx,31,-22,13,44,4);tctx.fill();
    const bits=sensors;
    for(let i=0;i<4;i++){
      tctx.fillStyle=bits[i]?'#111':'#dce7f2';
      tctx.beginPath();tctx.arc(37,-13+i*9,3.2,0,Math.PI*2);tctx.fill();tctx.strokeStyle='#78889a';tctx.stroke()
    }
    tctx.restore();
  }

  function updateSensors(){
    // crossing zone around bottom-center of loop
    const pp=((progress%1)+1)%1;
    const isCross = pp>0.22 && pp<0.275;
    if(isCross) sensors=[1,1,1,1];
    else if(lateral < -8) sensors=[0,0,1,1];
    else if(lateral > 8) sensors=[1,1,0,0];
    else sensors=[0,1,1,0];

    [...sensorRow.children].forEach((e,i)=>{e.textContent=sensors[i];e.className='sensor'+(sensors[i]?' on':'')});
    const str=sensors.join(''); sensorValue.textContent=str;
    carState.textContent=(running?'运行中 · ':'静止 · ')+(str==='1111'?'检测到交叉线':str==='0110'?'赛道中心':'正在纠偏');
  }

  function tick(now){
    const dt=Math.min(.05,(now-last)/1000);last=now;
    if(running){
      progress=(progress+carSpeed*dt)%1;
      // gentle correction simulation
      lateral += Math.sin(now/900)*0.03;
      lateral*=0.999;
      updateSensors();
    }
    drawTrack();drawArm();
    requestAnimationFrame(tick)
  }

  function drawArm(){
    const {w,h}=fit(arm,actx);actx.clearRect(0,0,w,h);
    const bg=actx.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#0c1726');bg.addColorStop(1,'#07111d');actx.fillStyle=bg;actx.fillRect(0,0,w,h);
    // table
    actx.fillStyle='#0b1420';actx.fillRect(0,h*.78,w,h*.22);
    actx.strokeStyle='rgba(84,111,142,.14)';for(let x=0;x<w;x+=28){actx.beginPath();actx.moveTo(x,h*.78);actx.lineTo(x,h);actx.stroke()}

    const bx=w*.48, by=h*.79;
    const rot=(servos.zhuan-90)*Math.PI/180;
    const shoulder=(servos.left-100)*Math.PI/110 + .92;
    const elbow=(servos.right-110)*Math.PI/95 - .72;
    const L1=Math.min(115,h*.30), L2=Math.min(105,h*.27);
    const x1=bx+Math.cos(shoulder)*L1, y1=by-Math.sin(shoulder)*L1;
    const a2=shoulder+elbow;
    const x2=x1+Math.cos(a2)*L2, y2=y1-Math.sin(a2)*L2;

    // base
    actx.save();actx.translate(bx,by);
    actx.fillStyle='#151b22';actx.beginPath();actx.ellipse(0,4,66,18,0,0,Math.PI*2);actx.fill();
    actx.fillStyle='#323d49';roundedRect(actx,-50,-25,100,30,9);actx.fill();
    actx.fillStyle='#788999';roundedRect(actx,-20,-49,40,28,5);actx.fill();
    actx.fillStyle='#d7e0e9';actx.beginPath();actx.arc(0,-35,9,0,Math.PI*2);actx.fill();actx.restore();

    function link(xa,ya,xb,yb,width){
      actx.save();actx.strokeStyle='#778b9f';actx.lineWidth=width+5;actx.lineCap='round';actx.beginPath();actx.moveTo(xa,ya);actx.lineTo(xb,yb);actx.stroke();
      actx.strokeStyle='#d2dbe4';actx.lineWidth=width;actx.beginPath();actx.moveTo(xa,ya);actx.lineTo(xb,yb);actx.stroke();
      actx.restore()
    }
    link(bx,by-36,x1,y1,15); link(x1,y1,x2,y2,13);

    // triangular parallel bar detail
    const off=18;
    link(bx-16,by-38,x1-10,y1+off,6);link(x1-10,y1+off,x2-8,y2+14,6);
    // joints
    [[bx,by-36],[x1,y1],[x2,y2]].forEach(([x,y])=>{actx.fillStyle='#2c3b4a';actx.beginPath();actx.arc(x,y,13,0,Math.PI*2);actx.fill();actx.fillStyle='#b5c1cc';actx.beginPath();actx.arc(x,y,5,0,Math.PI*2);actx.fill()});
    // wrist + gripper
    actx.save();actx.translate(x2,y2);actx.rotate(-a2+rot*.25);
    actx.fillStyle='#7e91a3';roundedRect(actx,-12,-10,25,22,4);actx.fill();
    const gap=8+Math.max(0,Math.min(18,(155-servos.zhua)*.7));
    actx.strokeStyle='#d5dee7';actx.lineWidth=5;actx.lineCap='round';
    actx.beginPath();actx.moveTo(8,-4);actx.lineTo(28,-gap);actx.lineTo(39,-gap);actx.stroke();
    actx.beginPath();actx.moveTo(8,5);actx.lineTo(28,gap);actx.lineTo(39,gap);actx.stroke();
    actx.restore();

    document.getElementById('vRot').textContent=Math.round(servos.zhuan)+'°';
    document.getElementById('vGrip').textContent=Math.round(servos.zhua)+'°';
    document.getElementById('vLeft').textContent=Math.round(servos.left)+'°';
    document.getElementById('vRight').textContent=Math.round(servos.right)+'°';
  }

  function reset(){
    running=false;progress=.02;lateral=0;sensors=[0,1,1,0];
    servos.zhuan=90;servos.zhua=145;servos.left=100;servos.right=110;
    updateSensors();runState.textContent='仿真就绪';consoleEl.textContent='已复位';
  }

  function sleep(ms){return new Promise(r=>setTimeout(r,Math.min(ms,1800)))}

  async function runCode(){
    const code=codeEl.value.trim();
    if(!code){consoleEl.textContent='代码为空：请先输入代码';return}
    runState.textContent='正在执行代码';
    consoleEl.textContent='解析代码…';
    const attachMap={};
    for(const m of code.matchAll(/([A-Za-z_]\w*)\.attach\s*\(\s*(\d+)\s*\)/g)){
      attachMap[m[1]]=Number(m[2])
    }
    const names={...servoPins};
    for(const [name,pin] of Object.entries(attachMap)) names[pin]=name;

    // Expand simple for loops of the form for(int p=a;p<=b;p++) { servo.write(p); }
    let source=code.replace(/for\s*\(\s*int\s+(\w+)\s*=\s*(-?\d+)\s*;\s*\1\s*(<=|>=)\s*(-?\d+)\s*;\s*\1\s*(\+\+|--)\s*\)\s*\{([\s\S]*?)\}/g,
      (_,v,a,op,b,step,body)=>{
        a=Number(a);b=Number(b);const dir=step==='++'?1:-1;let out='';
        for(let n=a;dir>0?n<=b:n>=b;n+=dir){out+=body.replace(new RegExp('\\b'+v+'\\b','g'),String(n))+'\n'}
        return out;
      });

    const ops=[];
    const re=/([A-Za-z_]\w*)\.write\s*\(\s*(-?\d+(?:\.\d+)?)\s*\)|delay\s*\(\s*(\d+)\s*\)/g;
    let m;while((m=re.exec(source))){
      if(m[1]) ops.push({type:'write',name:m[1],value:Number(m[2])});
      else ops.push({type:'delay',value:Number(m[3])})
    }
    if(!ops.length){consoleEl.textContent='暂未识别到 servo.write() 或 delay()';runState.textContent='仿真就绪';return}

    for(let i=0;i<ops.length;i++){
      const op=ops[i];
      if(op.type==='delay'){consoleEl.textContent='delay('+op.value+')';await sleep(op.value)}
      else {
        const key = servos.hasOwnProperty(op.name)?op.name:null;
        if(key){
          servos[key]=Math.max(0,Math.min(180,op.value));
          consoleEl.textContent=op.name+'.write('+op.value+')';
          await sleep(25)
        }
      }
    }
    consoleEl.textContent='执行完成，共 '+ops.length+' 条动作';
    runState.textContent='仿真就绪';
  }

  document.getElementById('startBtn').onclick=()=>{running=true;runState.textContent='赛道仿真运行中'};
  document.getElementById('stopBtn').onclick=()=>{running=false;runState.textContent='已停止'};
  document.getElementById('resetBtn').onclick=reset;
  document.getElementById('runCodeBtn').onclick=runCode;
  codeEl.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();runCode()}});
  addEventListener('resize',()=>{drawTrack();drawArm()});
  updateSensors();requestAnimationFrame(tick);
})();
</script>
</body>
</html>
