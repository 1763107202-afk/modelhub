import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const sb=createClient("https://qqkudaaxudxbfyeepyqw.supabase.co","sb_publishable_Fc_a5wM_PDh_FsaCW2UjzQ_oI98Dhef",{auth:{persistSession:false,detectSessionInUrl:false,autoRefreshToken:false,storage:{getItem:()=>null,setItem:()=>{},removeItem:()=>{}}}});
const $=id=>document.getElementById(id);let approved=false;

async function run(target){
if(!approved)return;
const button=$(target==="ppt"?"ppt":"zip");const old=button.textContent;button.disabled=true;

catch(e){try{popup?.close()}catch(_e){}$("result").textContent="下载失败："+error(e)}
finally{button.disabled=false}
}
