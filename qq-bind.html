<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QQ 机器人绑定 · 机械创新实验室</title><style>body{margin:0;background:#0c1727;color:#eaf2ff;font-family:"Microsoft YaHei",system-ui,sans-serif}main{max-width:630px;margin:7vh auto;padding:28px;background:#14233a;border-radius:20px}a{color:#9ec4ff}button{padding:12px 18px;border:0;background:#4f8cff;border-radius:10px;color:#fff;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}p{line-height:1.7}.panel{padding:16px;background:#0b192b;border-radius:12px;margin:15px 0}.muted{color:#a2b6cf}#code{font-family:monospace;font-size:25px;letter-spacing:.09em;overflow-wrap:anywhere}</style></head><body><main><a href="./profile.html">← 返回个人主页</a><h1>QQ 机器人私聊通知</h1><p>通过实验室账号绑定 QQ 机器人后，在平台允许的场景下可接收老师的进度提醒。老师评语默认仅在站内本人账号可见，不自动发送到群聊。</p><div class="panel"><p id="status">正在检查登录状态…</p><p id="bindState"></p><p id="code"></p><button id="request" hidden>生成一次性绑定码</button> <button id="unbind" hidden>解除 QQ 绑定</button><p class="muted">绑定码有效期 10 分钟，仅能使用一次。QQ 机器人正式接入前，绑定码功能用于技术准备；暂不能保证发送 QQ 消息。</p></div><p><strong>绑定流程：</strong>先登录实验室网站，生成一次性绑定码；待实验室 QQ 机器人完成官方审核、部署与回调验证后，向机器人私聊发送「绑定 空格 绑定码」。请勿在 QQ 群公开绑定码。</p></main><script type="module">
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const sb=createClient("https://qqkudaaxudxbfyeepyqw.supabase.co","sb_publishable_Fc_a5wM_PDh_FsaCW2UjzQ_oI98Dhef");
const el=id=>document.getElementById(id);
async function refresh(){
 const session=await sb.auth.getUser();
 if(!session.data.user){el("status").textContent="请先在网站登录账号后再操作。";return}
 el("status").textContent="已登录，账号："+(session.data.user.email||"成员");
 el("request").hidden=false;
 const r=await sb.from("qq_member_bindings").select("linked_at").eq("member_id",session.data.user.id).maybeSingle();
 if(r.error)el("bindState").textContent="读取绑定状态失败："+r.error.message;
 else{el("bindState").textContent=r.data?"已绑定 QQ 机器人（绑定时间："+new Date(r.data.linked_at).toLocaleString("zh-CN")+"）":"目前未绑定 QQ 机器人";el("unbind").hidden=!r.data}
}
el("request").onclick=async()=>{
 el("request").disabled=true;el("code").textContent="正在生成…";
 const r=await sb.rpc("request_qq_member_binding_code");
 el("code").textContent=r.error?"生成失败："+r.error.message:"绑定码："+r.data;
 el("request").disabled=false;
};
el("unbind").onclick=async()=>{
 if(!confirm("解除绑定后将无法通过该 QQ 身份接收后续私聊提醒，确定继续？"))return;
 const r=await sb.rpc("unbind_my_qq");
 if(r.error)el("bindState").textContent="解绑失败："+r.error.message;
 else{el("code").textContent="";await refresh()}
};
refresh();
</script></body></html>
