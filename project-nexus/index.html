ard .actions,.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.panel{background:#142235;border:1px solid #2b455e;border-radius:17px;padding:23px;margin:16px 0}.panel h3{margin:0 0 18px}.columns{display:grid;grid-template-columns:minmax(290px,1fr) minmax(350px,1.5fr);gap:20px}.field{margin-bottom:15px}.field label{display:block;margin-bottom:7px;color:#a6c8e0;font-size:13px}.list-item{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:13px;border-bottom:1px solid #2c4154;min-width:0}.list-item span{overflow-wrap:anywhere;min-width:0}.list-item .actions{display:flex;flex-shrink:0;gap:7px}.list-item button{padding:7px 9px}.pill{display:inline-block;border:1px solid #3c829d;background:#163449;border-radius:99px;padding:4px 9px;color:#7de3ef;font-size:12px}.progress{height:7px;background:#2b3d50;border-radius:9px;overflow:hidden}.progress>div{height:100%;background:#46c2e7}.chat-log{height:340px;overflow:auto;white-space:pre-wrap;background:#0d1c2c;border:1px solid #29445c;border-radius:12px;padding:16px;line-height:1.65}.bubble{background:#18324b;border-radius:12px;padding:11px 13px;margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.user{background:#205070}.bubble.error{background:#4c252b;color:#ffd4d4}.status{min-height:22px;color:#8ddbd2;margin:10px 0}.float .layout{display:block}.float .sidebar,.float .top{display:none}.float .content{padding:16px}.float .headline{font-size:21px}.float .chat-log{height:calc(100vh - 370px);min-height:180px}.float .chat-area{display:block}.float .float-hide{display:none!important}.float .panel{padding:12px}.float .chat-input{min-height:75px}img.preview{max-height:130px;max-width:100%;border-radius:8px;margin:10px 0}body:not(.float) .float-only{display:none}@media(max-width:1000px){.layout{grid-template-columns:195px 1fr}.columns{grid-template-columns:1fr}.content{padding:22px}.top{padding:14px}}@media(max-width:650px){.layout{grid-template-columns:1fr}.sidebar{display:none}.top{gap:
