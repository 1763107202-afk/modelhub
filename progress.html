<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>近期进度 | 江苏科技大学机械创新实验室交流平台</title><link rel="stylesheet" href="./styles-v39.css"><link rel="stylesheet" href="./theme-v3.css?v=20260924-1925"><script src="./theme-init-v2.js?v=20260924-1910"></script></head><body data-page="progress"><div id="siteHeader"></div><main><section class="pageHero wrap"><span class="eyebrow">RECENT PROGRESS</span><h1>近期进度</h1><p>记录阶段性进展与下一时期目标，成员之间可以互相查看最新更新。</p></section><section class="section wrap"><div id="progressGate"></div><div id="progressContent" class="progressLayout hidden"><form id="progressForm" class="form glass progressForm"><h3>提交近期进度</h3><label>近期进度<textarea id="progressCurrent" rows="6" maxlength="5000" required placeholder="这段时间完成了什么、目前做到哪一步、遇到哪些问题"></textarea></label><label>下一时期目标<textarea id="progressGoal" rows="5" maxlength="5000" required placeholder="下一阶段准备完成哪些任务、达到什么目标"></textarea></label><label>相关链接（可选）<input id="progressLink" type="url" placeholder="https://..."></label><label>附件（可选）<input id="progressFile" type="file"></label><div id="progressFilePreview" class="progressFilePreview"></div><small class="profileHint">支持图片、视频、PPT、PDF、Word、压缩包及其他常用文件；每次提交可附带 1 个文件和 1 个链接。</small><button class="btn pri" type="submit">提交近期进度</button></form><div class="progressTabs"><section class="progressReminder glass"><div class="progressSummaryHead"><div><span class="eyebrow">REMINDER</span><h2>两周未更新提醒</h2></div><div class="progressSubmitterCount"><b id="progressReminderCount">0</b><span>人</span></div></div><p class="progressReminderHint">超过 14 天没有新的进度记录会进入提醒区；从未提交过的成员按注册时间计算。</p><div id="progressReminderList" class="progressReminderList"><div class="empty">正在检查成员进度…</div></div></section><section class="progressSummary glass"><div class="progressSummaryHead"><div><span class="eyebrow">SUBMITTED MEMBERS</span><h2>已提交成员</h2></div><div class="progressSubmitterCount"><b id="progressSubmitterCount">0</b><span>人</span></div></div><div id="progressSubmitterNames" class="progressNameList"><span class="progressNoSubmitter">暂时还没有成员提交</span></div></section><section><div class="progressSectionHead"><div><span class="eyebrow">ALL MEMBERS</span><h2>成员最新更新</h2></div><small>共 <b id="progressAllCount">0</b> 条</small></div><div id="progressFeed" class="progressList"></div></section><section><div class="progressSectionHead"><div><span class="eyebrow">MY RECORDS</span><h2>我的提交记录</h2></div><small>共 <b id="progressMineCount">0</b> 条</small></div><div id="myProgressList" class="progressList"></div></section></div></div></section></main><div id="siteFooter"></div><script type="module" src="./app-v48.js?v=20260924-1855"></script></body></html>
