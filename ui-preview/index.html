<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>实验室全站 UI 优化预览</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:#0b1828;color:#eaf5ff}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:9px 16px;background:#102a43;border-bottom:1px solid #345471;min-height:62px}
header b{font-size:14px}header small{font-size:11px;color:#acc4da}header select,header button,header a{font:inherit;font-size:12px;border:1px solid #4b7192;border-radius:8px;background:#193d5b;color:#edf8ff;padding:8px 11px;text-decoration:none;cursor:pointer}
header button[aria-pressed="true"]{background:#3a78a4;border-color:#7bc1ea}
header label{font-size:12px;color:#c9d8e9}.devices{display:flex;gap:5px;margin-left:auto}.devices button{min-width:56px}
main{height:calc(100dvh - 62px);overflow:auto;display:flex;justify-content:center;align-items:flex-start;background:#081524;padding:0}
iframe{border:0;background:#fff;display:block;width:100%;height:100%;transition:width .15s;box-shadow:0 0 36px #0005}
iframe[data-size="tablet"]{width:768px;max-width:100%}iframe[data-size="mobile"]{width:390px;max-width:100%}
#feedback{position:fixed;z-index:10;bottom:18px;left:50%;transform:translateX(-50%);background:#194361;border:1px solid #78aad0;border-radius:9px;padding:12px 18px;font-size:12px;max-width:calc(100vw - 24px);display:none;box-shadow:0 10px 35px #0007}
@media(max-width:800px){header{min-height:100px;gap:7px;padding:8px}main{height:calc(100dvh - 100px)}.devices{margin-left:0}header small{display:none}}
</style></head><body>
<header><b>机械创新实验室 · UI 优化预览</b><small>独立预览 / 原版业务文件未修改</small>
<label for="page">页面</label><select id="page">
<option value="index.html">网站首页</option><option value="lab.html">实验室介绍</option><option value="works.html">往届作品</option><option value="projects.html">项目 / 队伍</option><option value="progress.html">近期进度</option><option value="tutorials.html">教程中心</option><option value="files.html">资料库</option><option value="exams.html">试卷任务</option><option value="submit.html">提交作业</option><option value="profile.html">个人主页</option><option value="mine.html">我的提交</option><option value="admin.html">管理后台</option><option value="admin-members.html">成员管理</option><option value="member.html">成员资料</option><option value="member-submissions.html">成员提交</option><option value="download.html">软件下载</option><option value="exchange.html">交流中心</option>
</select><button id="contrast" type="button" aria-pressed="false">显示原版</button><a id="original" href="../index.html" target="_blank" rel="noopener">新窗口看原版 ↗</a>
<div class="devices" role="group" aria-label="屏幕尺寸"><button data-size="desktop" aria-pressed="true">桌面</button><button data-size="tablet" aria-pressed="false">平板</button><button data-size="mobile" aria-pressed="false">手机</button></div>
</header>
<main><iframe id="site" title="实验室网站设计预览" src="../index.html" data-size="desktop"></iframe></main>
<div id="feedback" role="status" aria-live="polite"></div>
<script>
(()=>{"use strict";
const frame=document.getElementById("site"),selector=document.getElementById("page"),contrast=document.getElementById("contrast"),original=document.getElementById("original"),hint=document.getElementById("feedback");
const allowed=new Set([...selector.options].map(o=>o.value));
const base=new URL("../",location.href);
const cssUrl=new URL("site-preview.css?v=20261018a",location.href).href;
let originalMode=false;
let lastHref="";
function show(text){hint.textContent=text;hint.style.display="block";clearTimeout(show.t);show.t=setTimeout(()=>hint.style.display="none",3000)}
function sync(){
 let win,doc;try{win=frame.contentWindow;doc=frame.contentDocument;if(!doc||!win||win.location.origin!==location.origin)return}catch{return}
 const current=win.location.pathname.split("/").pop()||"index.html";
 if(allowed.has(current)){selector.value=current;original.href=new URL(current,base).href}
 if(!originalMode){let link=doc.getElementById("uiPreviewOverride");if(!link){link=doc.createElement("link");link.id="uiPreviewOverride";link.rel="stylesheet";link.href=cssUrl;doc.head.appendChild(link)}}
 // A read-only safety layer in the iframe: event capture runs before application handlers.
 doc.addEventListener("submit",e=>{e.preventDefault();e.stopImmediatePropagation();show("预览模式禁止表单提交。请在原站操作。")},true);
 doc.addEventListener("click",e=>{
 const btn=e.target.closest("button");
 if(!btn)return;
 const content=(btn.textContent||"").trim();
 if(/(保存|提交|发布|上传|删除|移除|退出|注销|禁用|启用|清空|审批|驳回|批准|确认修改|重置密码|重设密码|刷新密钥|加入项目|发送)/.test(content)){
   e.preventDefault();e.stopImmediatePropagation();show("预览模式为只读，该操作已阻止。");
 }
 },true);
 doc.addEventListener("click",e=>{
  const link=e.target.closest("a[href]");if(!link||link.target==="_blank"||link.hasAttribute("download"))return;
  const href=link.getAttribute("href");if(!href||href[0]==="#"||/^(mailto:|tel:|javascript:)/i.test(href))return;
  let next;try{next=new URL(href,win.location.href)}catch{return}
  if(next.origin===location.origin&&next.pathname.startsWith(base.pathname)){
    const page=next.pathname.split("/").pop()||"index.html";
    if(allowed.has(page)){selector.value=page;original.href=new URL(page,base).href}
  }
 },true);
}
frame.addEventListener("load",sync);
selector.addEventListener("change",()=>{lastHref=selector.value;frame.src=new URL(selector.value,base).href});
contrast.addEventListener("click",()=>{originalMode=!originalMode;contrast.textContent=originalMode?"显示优化版":"显示原版";contrast.setAttribute("aria-pressed",String(originalMode));try{const d=frame.contentDocument;const l=d?.getElementById("uiPreviewOverride");if(l)l.disabled=originalMode;if(!originalMode&&!l)sync()}catch{}});
document.querySelectorAll(".devices button").forEach(b=>b.addEventListener("click",()=>{frame.dataset.size=b.dataset.size;document.querySelectorAll(".devices button").forEach(k=>k.setAttribute("aria-pressed",String(k===b)))}));
const params=new URLSearchParams(location.search);const start=params.get("page");if(allowed.has(start)){selector.value=start;frame.src=new URL(start,base).href;}
})();
</script></body></html>
