name: Build Windows Desktop App

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-windows.yml"
      - "assets/lab-logo-transparent.svg"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install Tauri CLI
        working-directory: desktop
        run: npm install

      - name: Generate application icons
        working-directory: desktop
        run: npm run icons

      - name: Build Windows NSIS installer
        working-directory: desktop
        run: npm run build:windows

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: JUST-Mechanical-Innovation-Lab-Windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish installer to website
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path downloads | Out-Null
          $installer = Get-ChildItem "desktop/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer not found." }
          Copy-Item $installer.FullName "downloads/JUST-Lab-Platform-Windows-x64-setup.exe" -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/JUST-Lab-Platform-Windows-x64-setup.exe
          if (git diff --cached --quiet) {
            Write-Host "Installer is unchanged."
          } else {
            git commit -m "Publish Windows desktop installer"
            git push
          }
