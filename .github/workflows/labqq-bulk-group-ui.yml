name: LabQQ bulk reminder group notice

on:
  push:
    paths:
      - .github/workflows/labqq-bulk-group-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch progress page and app
        shell: python
        run: |
          from pathlib import Path

          app = Path("app-v74.js")
          text = app.read_text(encoding="utf-8")

          replacements = [
              (
                  'if(!confirm("确定对选中的 "+ids.length+" 名逾期成员逐一发送提醒？"))return;\n'
                  ' const btn=q("#progressBulkSend"),cancel=q("#progressBulkCancel");btn.disabled=true;cancel.disabled=true;\n'
                  ' let site=0,push=0,failed=0,skipped=0;',
                  'if(!confirm("确定对选中的 "+ids.length+" 名逾期成员逐一发送提醒，并发送一条 QQ 群提醒？"))return;\n'
                  ' const btn=q("#progressBulkSend"),cancel=q("#progressBulkCancel");btn.disabled=true;cancel.disabled=true;\n'
                  ' let site=0,push=0,failed=0,skipped=0,groupQueued=false,groupError="";\n'
                  ' try{\n'
                  '  const batchId=crypto.randomUUID();\n'
                  '  const groupResult=await supabase.rpc("qq_enqueue_bulk_reminder_group",{p_batch_id:batchId,p_count:ids.length});\n'
                  '  groupQueued=!groupResult.error&&groupResult.data===true;\n'
                  '  if(groupResult.error)groupError=String(groupResult.error.message||"RPC 调用失败");\n'
                  ' }catch(groupErr){groupError=String(groupErr?.message||groupErr)}\n'
              ),
              (
                  'q("#progressBulkStatus").textContent="已完成：站内 "+site+" 条；微信接口接受 "+push+" 条；微信未成功 "+failed+" 条；重复提醒或限制跳过 "+skipped+" 条。微信是否实际收到需成员确认。";',
                  'const groupStatus=groupQueued?"；群提醒已加入发送队列":("；群提醒未入队"+(groupError?"："+groupError:""));\n'
                  ' q("#progressBulkStatus").textContent="已完成：站内 "+site+" 条；微信接口接受 "+push+" 条；微信未成功 "+failed+" 条；重复提醒或限制跳过 "+skipped+" 条"+groupStatus+"。微信是否实际收到需成员确认。";'
              ),
              (
                  'q("#progressBulkStatus").textContent="将向勾选成员发送站内提醒并尝试微信推送。";',
                  'q("#progressBulkStatus").textContent="将向勾选成员发送站内提醒并尝试微信推送，同时发送一条 QQ 群提醒。";'
              ),
              (
                  'const BOOTSTRAP_VERSION="2026.10.24.submission-bulk-ux50";',
                  'const BOOTSTRAP_VERSION="2026.11.05.labqq-bulk-group1";'
              ),
          ]
          for old, new in replacements:
              source = text if old.startswith("const BOOTSTRAP_VERSION") else None
              if source is None:
                  if old not in text:
                      raise SystemExit("Missing expected app source: " + old[:80])
                  text = text.replace(old, new, 1)
              else:
                  cache = Path("cache-loader.js")
                  cache_text = cache.read_text(encoding="utf-8")
                  if old not in cache_text:
                      raise SystemExit("Missing expected cache source")
                  cache.write_text(cache_text.replace(old, new, 1), encoding="utf-8")

          app.write_text(text, encoding="utf-8")

          progress = Path("progress.html")
          html = progress.read_text(encoding="utf-8")
          old_copy = "通知将逐人发送，不会自动定时推送，也不会在 QQ 群公开。"
          new_copy = "通知将逐人发送并尝试微信推送，同时向 QQ 群发送一条提醒汇总；不会自动定时推送。"
          if old_copy not in html:
              raise SystemExit("Missing expected progress copy")
          html = html.replace(old_copy, new_copy, 1)
          html = html.replace(
              "cache-loader.js?v=2026.10.23.progress-consistency-ux45-2",
              "cache-loader.js?v=2026.11.05.labqq-bulk-group1",
              1,
          )
          progress.write_text(html, encoding="utf-8")

      - name: Commit patched site
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-v74.js cache-loader.js progress.html
          git commit -m "Send one QQ group notice per bulk reminder batch"
          git push
