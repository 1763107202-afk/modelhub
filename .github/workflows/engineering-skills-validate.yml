name: Engineering Skills compatibility
on:
  push:
    branches: [chatgpt-skills-integration]
    paths:
      - "integrations/chatgpt-skills/**"
      - ".agents/plugins/marketplace.json"
      - ".github/workflows/engineering-skills-validate.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install manifest validation requirement
        run: python -m pip install PyYAML
      - name: Validate and archive six skills
        run: |
          cd integrations/chatgpt-skills
          python scripts/build_plugin.py
          python scripts/build_plugin.py --output "$RUNNER_TEMP/engineering-five-skills-0.2.0.zip"
      - name: Gateway mock contract tests
        run: cd integrations/chatgpt-skills/gateway && npm test
      - name: Upload installable plugin archive
        uses: actions/upload-artifact@v4
        with:
          name: engineering-five-skills-0.2.0-installable
          path: ${{ runner.temp }}/engineering-five-skills-0.2.0.zip
          if-no-files-found: error
          retention-days: 30
