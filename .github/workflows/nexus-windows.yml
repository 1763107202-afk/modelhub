name: PROJECT NEXUS · Electron Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'project-nexus/**'
      - '.github/workflows/nexus-windows.yml'
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: project-nexus
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 核验完整工程
        shell: pwsh
        run: |
          foreach ($file in @('package.json','main.js','preload.js','renderer.js','index.html')) {
            if (!(Test-Path -LiteralPath $file)) { throw "缺少源代码: $file" }
          }
          node --check main.js
          node --check preload.js
          node --check renderer.js
      - name: 安装依赖
        shell: pwsh
        run: npm install --no-audit --no-fund
      - name: 基本校验
        shell: pwsh
        run: npm test
      - name: 生成 Windows 安装包与便携版
        shell: pwsh
        run: npm run build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: 上传 Windows 构建结果
        uses: actions/upload-artifact@v4
        with:
          name: PROJECT-NEXUS-Windows-x64
          path: |
            project-nexus/dist/*.exe
          if-no-files-found: error
          retention-days: 30
