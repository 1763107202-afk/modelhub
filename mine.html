<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>我的提交 | 江苏科技大学机械创新实验室交流平台</title><link rel="stylesheet" href="./styles.css?v=20260923-2235"></head><body data-page="mine"><div id="siteHeader"></div><main><section class="pageHero wrap"><span class="eyebrow">MY SUBMISSIONS</span><h1>我的提交</h1><p>查看、修改或取消自己已经提交的作业记录。</p></section><section class="section wrap"><div id="pageGate"></div><div class="table"><table><thead><tr><th>试卷 / 任务</th><th>文件</th><th>状态</th><th>提交时间</th><th>操作</th></tr></thead><tbody id="mineBody"></tbody></table></div></section></main><div id="siteFooter"></div>
<dialog id="editSubmissionDialog" class="dialog">
  <form id="editSubmissionForm" class="dialogbox">
    <span class="eyebrow">EDIT SUBMISSION</span>
    <h2 style="margin:0">修改已提交作业</h2>
    <input id="editSubmissionId" type="hidden">
    <label>对应试卷 / 任务<select id="editExam"></select></label>
    <label>姓名 / 队伍名称<input id="editSubmitName" maxlength="80"></label>
    <label>备注<textarea id="editNote" rows="3" maxlength="500"></textarea></label>
    <label>替换压缩包（可选）<input id="editFile" type="file" accept=".zip,.rar,.7z"></label>
    <small id="editCurrentFile" class="profileHint"></small>
    <small id="editStatus" class="profileHint"></small>
    <div class="actions">
      <button id="saveSubmissionEdit" class="btn pri" type="submit">保存修改</button>
      <button id="closeEditSubmission" class="btn ghost" type="button">取消</button>
    </div>
  </form>
</dialog>
<script type="module" src="./app.js?v=20260923-2235"></script></body></html>
