<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>项目 / 队伍管理 | 江苏科技大学机械创新实验室交流平台</title><link rel="stylesheet" href="./styles-v43.css?v=20260925-0028"><link rel="stylesheet" href="./theme-v3.css?v=20260924-1925"><script src="./theme-init-v2.js?v=20260924-1910"></script><style>
.projectToolbar{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:18px;flex-wrap:wrap}.projectGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.projectCardV2{padding:20px;border:1px solid #1d334c;border-radius:20px;background:#0b192a}.projectTopV2{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.projectTopV2 h3{margin:4px 0 4px}.projectMeta{color:#7890aa;font-size:12px}.projectDesc{color:#9eb0c5;white-space:pre-wrap}.projectMembersV2{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.projectChip{padding:5px 9px;border-radius:999px;background:#102b48;border:1px solid #28527b;color:#b9dcff;font-size:12px;font-weight:800}.projectStats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.projectStat{padding:10px;border-radius:12px;background:#081524;border:1px solid #1b3048}.projectStat span{display:block;font-size:11px;color:#7890aa}.projectStat b{display:block;margin-top:2px}.projectFormGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.memberPicker{max-height:260px;overflow:auto;padding:10px;border:1px solid #223a57;border-radius:12px;background:#081524}.memberPick{display:flex;gap:9px;align-items:center;padding:8px 6px}.memberPick input{width:auto;margin:0}.statusTag{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800;background:#14304a;color:#a9d6ff}.statusTag.completed{background:#173f31;color:#86edba}.statusTag.paused{background:#493518;color:#ffd18b}.statusTag.archived{background:#2b3140;color:#aeb8c7}html[data-theme="light"] .projectCardV2,html[data-theme="light"] .projectStat,html[data-theme="light"] .memberPicker{background:#fff;border-color:#d8e4ef}html[data-theme="light"] .projectDesc,html[data-theme="light"] .projectMeta,html[data-theme="light"] .projectStat span{color:#64778b}@media(max-width:850px){.projectGrid,.projectFormGrid{grid-template-columns:1fr}.projectStats{grid-template-columns:1fr 1fr 1fr}}
.pendingMemberBox{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:10px}.pendingMemberTags{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}.pendingTag{display:inline-flex;align-items:center;gap:7px;padding:5px 9px;border-radius:999px;background:#392b16;border:1px solid #6a5127;color:#ffd99a;font-size:12px;font-weight:800}.pendingTag button{border:0;background:transparent;color:inherit;cursor:pointer;padding:0}.projectChip.pending{background:#392b16;border-color:#6a5127;color:#ffd99a}.projectProgressBtn{width:100%;text-align:left;color:inherit;cursor:pointer;font:inherit}.projectProgressBtn:hover{border-color:#4b79a8;transform:translateY(-1px)}.projectProgressList{display:grid;gap:12px;max-height:62vh;overflow:auto;margin-top:14px;padding-right:4px}.projectProgressItem{padding:15px;border:1px solid #203954;border-radius:15px;background:#091726}.projectProgressItemHead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:10px}.projectProgressItemHead b{font-size:15px}.projectProgressItemHead time{font-size:12px;color:#7890aa;white-space:nowrap}.projectProgressFields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.projectProgressFields section{padding:11px;border-radius:12px;background:#0d1d30}.projectProgressFields span{display:block;font-size:11px;color:#7890aa;margin-bottom:4px}.projectProgressFields p{margin:0;white-space:pre-wrap;line-height:1.65}.projectProgressEmpty{padding:24px;text-align:center;color:#7890aa}html[data-theme="light"] .projectProgressItem{background:#fff;border-color:#d8e4ef}html[data-theme="light"] .projectProgressFields section{background:#f6f9fc}@media(max-width:650px){.projectProgressFields{grid-template-columns:1fr}}
</style></head><body data-page="projects"><div id="siteHeader"></div><main><section class="pageHero wrap"><span class="eyebrow">PROJECT MANAGEMENT</span><h1>项目 / 队伍管理</h1><p>比赛、仿真论文、科研、专利、课程设计等都可以建立项目，并与个人进度或队伍进度直接关联。</p></section><section class="section wrap"><div id="projectGate"></div><div id="projectContent" class="hidden"><div class="projectToolbar"><div><span class="eyebrow">PROJECT DIRECTORY</span><h2 style="margin:3px 0">实验室项目</h2></div><button id="newProjectBtn" class="btn pri" type="button">+ 新建项目</button></div><div id="projectGrid" class="projectGrid"><div class="empty">正在加载项目…</div></div></div></section></main><div id="siteFooter"></div>
<dialog id="projectProgressDialog" class="dialog"><div class="dialogbox"><span class="eyebrow">PROJECT PROGRESS</span><h2 id="projectProgressTitle" style="margin:4px 0 4px">项目进度</h2><p id="projectProgressMeta" class="projectMeta"></p><div id="projectProgressList" class="projectProgressList"><div class="projectProgressEmpty">正在加载…</div></div><div class="actions"><button id="projectProgressClose" class="btn ghost" type="button">关闭</button></div></div></dialog>
<dialog id="projectDialog" class="dialog"><form id="projectForm" class="dialogbox"><span class="eyebrow">PROJECT EDITOR</span><h2 id="projectDialogTitle" style="margin:4px 0 12px">新建项目</h2><input id="projectId" type="hidden"><div class="projectFormGrid"><label>项目名称<input id="projectName" maxlength="160" required placeholder="例如：桥梁桁架有限元分析"></label><label>项目类型<select id="projectType"><option value="competition">竞赛项目</option><option value="simulation_paper">仿真 / 论文</option><option value="research">科研项目</option><option value="patent">专利项目</option><option value="design">机械设计 / 制作</option><option value="course">课程设计</option><option value="other">其他项目</option></select></label><label>项目形式<select id="projectMode"><option value="personal">个人项目</option><option value="team">团队项目</option></select></label><label>项目状态<select id="projectStatus"><option value="active">进行中</option><option value="paused">暂停</option><option value="completed">已完成</option><option value="archived">已归档</option></select></label></div><label>当前阶段<input id="projectStage" maxlength="120" placeholder="例如：有限元建模 / 论文撰写 / 样机调试"></label><label>项目说明<textarea id="projectDescription" rows="4" maxlength="3000" placeholder="项目目标、研究内容或比赛说明"></textarea></label><div id="projectMembersWrap"><label>已注册成员</label><input id="projectMemberSearch" type="search" placeholder="搜索姓名或专业"><div id="projectMemberPicker" class="memberPicker"><div class="empty">正在加载正式成员…</div></div><div class="pendingMemberBox"><input id="pendingMemberInput" maxlength="80" placeholder="未注册成员姓名，例如：张三"><button id="addPendingMember" class="btn sec" type="button">加入成员</button></div><div id="pendingMemberTags" class="pendingMemberTags"></div><small class="profileHint">未注册成员可以先按姓名加入项目；本人注册后可在项目页点击“加入项目”。</small></div><div class="actions"><button class="btn pri" type="submit">保存项目</button><button id="projectCancel" class="btn ghost" type="button">取消</button></div></form></dialog>
