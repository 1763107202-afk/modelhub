<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>管理后台 | ModelHub</title><link rel="stylesheet" href="./styles.css"></head><body data-page="admin"><div id="siteHeader"></div><main><section class="pageHero wrap"><span class="eyebrow">ADMIN CENTER</span><h1>管理后台</h1><p>内容发布与提交管理集中在管理页；成员权限管理继续使用独立成员后台。</p></section><section class="section wrap"><div id="adminGate"></div><div id="adminContent" class="hidden"><div class="adminLinks"><a class="adminLink" href="./admin-members.html"><b>成员与权限管理 →</b><span>查看成员信息、设置副管理员、编辑成员资料。</span></a><a class="adminLink" href="./exams.html"><b>查看已发布任务 →</b><span>前往独立试卷任务页面核对发布结果。</span></a></div><div class="adminGrid"><form id="workForm" class="form glass"><h3>发布往届作品</h3><div class="two"><label>作品名称<input id="workTitle" required></label><label>年份<input id="workYear" type="number" min="2000" max="2100"></label></div><label>团队 / 作者<input id="workTeam"></label><label>作品简介<textarea id="workDesc" rows="4"></textarea></label><div class="two"><label>作品封面<input id="workCover" type="file" accept="image/*"></label><label>详情链接<input id="workUrl" type="url" placeholder="https://..."></label></div><button class="btn pri">发布作品</button></form><form id="examForm" class="form glass"><h3>发布 PDF 试卷 / 任务</h3><label>标题<input id="examTitle" required></label><label>说明<textarea id="examDesc" rows="3"></textarea></label><div class="two"><label>截止时间<input id="deadline" type="datetime-local"></label><label>PDF 文件<input id="pdf" type="file" accept=".pdf,application/pdf" required></label></div><button class="btn pri">发布任务</button></form><form id="videoForm" class="form glass"><h3>发布教程视频</h3><label>标题<input id="videoTitle" required></label><label>简介<textarea id="videoDesc" rows="3"></textarea></label><label>来源<select id="videoMode"><option value="url">视频链接</option><option value="file">上传视频文件</option></select></label><label id="urlWrap">视频链接<input id="videoUrl" type="url" placeholder="https://..."></label><label id="fileWrap" class="hidden">视频文件<input id="videoFile" type="file" accept="video/*"></label><button class="btn pri">发布教程</button></form><div class="form glass"><h3>权限说明</h3><p style="color:#8fa4bd">主管理员和副管理员都可以发布作品、任务和教程，并处理提交记录；只有主管理员可以设置或取消副管理员。</p><a class="btn sec" href="./admin-members.html">进入成员后台</a></div></div><div class="head" style="margin-top:28px"><div><span class="eyebrow">SUBMISSIONS</span><h2>全部提交记录</h2></div></div><div class="table"><table><thead><tr><th>任务</th><th>姓名</th><th>专业</th><th>提交人</th><th>文件</th><th>时间</th><th>操作</th></tr></thead><tbody id="allBody"></tbody></table></div></div></section></main><div id="siteFooter"></div><script type="module" src="./app.js"></script></body></html>
