name: Build FastQuiz Android APK
on:
  push:
    branches: [fastquiz-android-offline]
    paths:
      - 'fastquiz-android/**'
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch full ECDICT
        run: |
          curl --fail --location --retry 4 --connect-timeout 25 https://raw.githubusercontent.com/skywind3000/ECDICT/master/ecdict.csv -o /tmp/ecdict.csv
          test "$(wc -c </tmp/ecdict.csv)" -gt 20000000
      - name: Create offline dictionary
        run: python fastquiz-android/tools/make_dictionary.py /tmp/ecdict.csv fastquiz-android/app/lexicon.db
      - name: Get packaging runtime
        run: |
          curl --fail --location --retry 4 'https://github.com/SuperMonster003/AutoJs6/releases/download/v6.7.0/autojs6-v6.7.0-universal-047ae62e.apk' -o /tmp/autojs.apk
          curl --fail --location --retry 4 'https://github.com/Steven-Qiang/AutoJs6-ApkBuilder/releases/download/v1.1.0/apkbuilder-cli.jar' -o /tmp/builder.jar
          test "$(wc -c </tmp/autojs.apk)" -gt 10000000
      - name: Package signed APK
        run: java -jar /tmp/builder.jar -a /tmp/autojs.apk -s fastquiz-android/app -o FastQuiz_Offline.apk
      - name: Check generated APK
        run: |
          test -s FastQuiz_Offline.apk
          unzip -t FastQuiz_Offline.apk | tail -1
          sha256sum FastQuiz_Offline.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FastQuiz_Offline_APK
          path: FastQuiz_Offline.apk
          if-no-files-found: error
