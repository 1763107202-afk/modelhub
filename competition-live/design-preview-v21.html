<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOVE.ARENA V21 · 独立视觉预览</title><style>
:root{--bg:#080c11;--panel:#121b23;--up:#1a2731;--line:#354551;--text:#f6f8f8;--sub:#b6c7cf;--muted:#718995;--gold:#ffc178;--a:#32cda9;--b:#f0ae63;--bad:#e86b68;--num:"Bahnschrift","Arial Narrow",monospace}
*{box-sizing:border-box}html,body{background:var(--bg);color:var(--text);margin:0;font-family:"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif}
body{overflow:hidden}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#shell{width:100vw;height:100dvh;display:grid;grid-template-rows:clamp(64px,8vh,82px) minmax(0,1fr) clamp(42px,5vh,54px);gap:clamp(7px,.85vh,12px);padding:0 clamp(10px,1vw,23px) clamp(7px,.8vh,12px);overflow:hidden}
header{min-width:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.65fr) minmax(0,.8fr);align-items:center;gap:10px;border-bottom:1px solid #41515c}
.brand{display:flex;align-items:center;gap:12px;min-width:0}.brand img{height:clamp(43px,3.4vw,62px);width:clamp(43px,3.4vw,62px);object-fit:contain;border-radius:50%;background:#fff}
.brand-text{display:flex;flex-direction:column;gap:3px}.brand-text small{font-size:clamp(9px,.65vw,12px);color:var(--sub)}.brand-text strong{font-size:clamp(15px,1.15vw,22px);white-space:nowrap}
.heading{display:flex;justify-content:center;align-items:center;gap:9px;min-width:0}.heading h1{margin:0;font-size:clamp(20px,1.7vw,34px);letter-spacing:-.6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.heading small{border-left:2px solid var(--gold);padding-left:9px;color:#e1bb8b;font-size:clamp(9px,.7vw,13px);white-space:nowrap}
.time-now{justify-self:end;font:750 clamp(21px,1.8vw,35px)/1 var(--num);font-variant-numeric:tabular-nums}
main{display:grid;grid-template-columns:minmax(0,56fr) minmax(0,44fr);gap:clamp(9px,1vw,17px);min-height:0;min-width:0;overflow:hidden}
.left{display:grid;grid-template-rows:minmax(0,1fr) clamp(99px,14vh,143px);gap:clamp(8px,.9vh,11px);min-height:0;min-width:0}
.stage{display:grid;grid-template-rows:clamp(82px,10vh,112px) minmax(0,1fr) clamp(29px,3.5vh,38px);border:1px solid var(--line);border-top:2px solid #cf9e64;min-height:0;overflow:hidden;background:var(--panel)}
.stage-top{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;position:relative;background:#16232e;padding:5px clamp(8px,1vw,20px);min-width:0;border-bottom:1px solid #3e5059}
.round{display:flex;align-items:center;gap:clamp(7px,.65vw,13px);min-width:0}.round small{font-size:clamp(10px,.7vw,14px);color:var(--sub);white-space:nowrap;font-weight:750}.round strong{font:900 clamp(40px,3.7vw,70px)/1 var(--num);color:#e5bd88}.round em{font-style:normal;font-size:clamp(10px,.7vw,14px);color:var(--muted);white-space:nowrap}
.timer{justify-self:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:clamp(145px,13vw,270px);max-height:100%;padding:4px clamp(9px,.9vw,17px);background:#09121a;border:1px solid #81623e}
.timer small{color:#d3e0e5;font-size:clamp(10px,.7vw,13px);font-weight:750;white-space:nowrap}.timer b{font:900 clamp(42px,4.3vw,78px)/1 var(--num);font-variant-numeric:tabular-nums;color:var(--gold)}
.timer.warn{border-color:var(--b)}.timer.critical{border-color:var(--bad);background:#241516}.timer.critical b{color:#ff998c}
.stage-meta{display:flex;flex-direction:column;align-items:flex-end;gap:5px;min-width:0}.stage-meta strong{font-size:clamp(11px,.8vw,15px);white-space:nowrap}.stage-meta small{font-size:clamp(9px,.7vw,13px);white-space:nowrap;color:var(--muted)}
.rail{position:absolute;bottom:0;left:0;right:0;height:3px;background:#384854}.rail i{display:block;background:var(--gold);height:100%;width:100%;transform-origin:left;transition:transform .3s ease}
.duel{display:grid;grid-template-rows:repeat(2,minmax(0,1fr));min-height:0;position:relative}
.vs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;background:#091016;border:1px solid #65747d;color:#ebc18d;font:850 17px/1 var(--num);padding:8px}
.lane{display:grid;grid-template-columns:clamp(40px,5vw,82px) minmax(0,1fr) minmax(190px,38%);gap:clamp(7px,.9vw,19px);align-items:center;min-height:0;padding:clamp(9px,1.3vh,19px) clamp(8px,1.1vw,21px);border-left:4px solid var(--a);background:#111c26;border-bottom:1px solid var(--line)}
.lane.b{border-left-color:var(--b);background:#15212a;border-bottom:0}.lane-id{width:clamp(39px,4.4vw,76px);height:clamp(50px,5.3vw,90px);border:1px solid #397e6b;color:#9aebd3;background:#16352f;display:grid;place-items:center;font:900 clamp(32px,3.9vw,66px)/1 var(--num)}
.b .lane-id{border-color:#96754c;color:#f7d5a5;background:#382c21}
.identity{min-width:0;display:flex;flex-direction:column;gap:clamp(6px,1vh,13px)}.identity small{color:#a4bdc7;font-size:clamp(9px,.72vw,14px)}.identity strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:clamp(28px,2.65vw,52px);line-height:1.1}.identity strong.long{font-size:clamp(22px,2vw,39px)}
.state{font-size:clamp(11px,.8vw,16px);color:#e6c38c;font-weight:750}.state:before{content:"● ";font-size:10px}.state.run{color:#79dfbd}.state.done{color:#b3cad1}.state.bad{color:#ff9f92}
.metrics{border-left:1px solid #435764;display:grid;grid-template-columns:1fr 1fr;min-width:0;align-items:center;height:100%}.metric{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:clamp(7px,1vh,12px);padding-left:clamp(7px,.7vw,14px)}
.metric+ .metric{border-left:1px solid #31414d}.metric small{color:#9fb8c5;font-size:clamp(10px,.7vw,14px)}.metric b{font:850 clamp(30px,2.85vw,57px)/1 var(--num);font-variant-numeric:tabular-nums;white-space:nowrap}.metric.duration b{font-size:clamp(17px,1.7vw,35px)}
.metric b.placeholder{opacity:.38;color:#8697a0}
.stage-foot{display:flex;align-items:center;gap:8px;background:#18312e;color:#d1eadc;padding:0 13px;font-weight:650;font-size:clamp(11px,.78vw,15px);min-width:0}.stage-foot:before{content:"";width:6px;height:6px;flex:0 0 auto;border-radius:50%;background:var(--a)}.stage-foot span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.waiting{min-height:0;background:#15212b;border:1px solid var(--line);display:grid;grid-template-rows:auto minmax(0,1fr) 4px;gap:clamp(5px,.75vh,10px);padding:clamp(8px,.9vh,14px) clamp(10px,1vw,20px)}
.wait-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.wait-head strong{font-size:clamp(15px,1.13vw,22px)}.wait-head small{font-size:clamp(9px,.65vw,12px);color:var(--sub);white-space:nowrap}
.wait-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(7px,.8vw,15px);min-height:0}.wait-team{display:flex;align-items:center;gap:9px;min-width:0;background:#1e2e39;border-left:2px solid var(--a);padding:3px 9px}.wait-team.b{border-left-color:var(--b)}
.wait-letter{font:850 clamp(18px,1.5vw,27px)/1 var(--num);color:#9fe9d1;border:1px solid var(--a);width:clamp(25px,2vw,36px);height:clamp(29px,2.4vw,41px);display:grid;place-items:center;flex:0 0 auto}.b .wait-letter{color:#f4d2a5;border-color:var(--b)}
.wait-info{display:flex;flex-direction:column;min-width:0;gap:2px}.wait-info small{font-size:clamp(9px,.65vw,12px);color:var(--sub)}.wait-info strong{font-size:clamp(14px,1.13vw,23px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.progress{display:grid;grid-template-columns:repeat(18,minmax(0,1fr));gap:3px;height:4px}.progress i{background:#3b4b56}.progress i.done{background:#3b9e87}.progress i.current{background:var(--gold)}
.board{display:grid;grid-template-rows:clamp(55px,7vh,77px) minmax(0,1fr) 18px;min-width:0;min-height:0;background:var(--panel);border:1px solid var(--line);padding:0 clamp(8px,.95vw,18px);overflow:hidden}
.board-head{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid #47545f}.board-head strong{font-size:clamp(20px,1.5vw,31px);white-space:nowrap}.board-head small{font-size:clamp(10px,.74vw,14px);color:#a3d4c5;white-space:nowrap}
.rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(11px,1vw,22px);min-height:0;padding:3px 0;position:relative}.rows:after{content:"";position:absolute;left:50%;top:4px;bottom:4px;background:#3e4d58;width:1px}
.column{display:grid;grid-template-rows:repeat(18,minmax(0,1fr));min-height:0;overflow:hidden}
.rank{display:grid;grid-template-columns:clamp(20px,1.4vw,29px) minmax(0,1fr) max-content;min-height:0;min-width:0;gap:clamp(3px,.3vw,7px);align-items:center;border-bottom:1px solid #2a3945;padding:0 3px}
.rank:nth-child(odd){background:#ffffff05}.rank.a{border-left:3px solid var(--a);background:#18362e}.rank.b{border-left:3px solid var(--b);background:#33291e}.rank.pending .name{color:#b8c7cc;font-weight:600}.rank.done .name{color:#f2f5f6}
.place{font:850 clamp(11px,.85vw,16px)/1 var(--num);color:#90a5b1;white-space:nowrap}.rank.medal-1 .place{color:#ffdba3;border:1px solid #a7804b}.rank.medal-2 .place{color:#e4eaf0;border:1px solid #aebbc6}.rank.medal-3 .place{color:#ecbd9c;border:1px solid #9d715e}
.name{font-size:clamp(10px,.8vw,15px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;font-weight:700}
.rank.long .name{font-size:clamp(9px,.68vw,13px)}
.status{font-size:clamp(9px,.68vw,12px);white-space:nowrap;color:#8da1ad}.rank.a .status{color:#8fe6cc}.rank.b .status{color:#f1c58c}
.result{display:flex;align-items:center;gap:5px;white-space:nowrap;font-family:var(--num);font-variant-numeric:tabular-nums}.result b{font-size:clamp(12px,.92vw,17px);color:#edbc7b}.result small{font-size:clamp(9px,.67vw,12px);color:#b6ccd6;border-left:1px solid #51616b;padding-left:5px}
.board-foot{display:flex;justify-content:space-between;align-items:center;color:#869ba7;font-size:clamp(9px,.6vw,11px);white-space:nowrap}
footer{display:flex;gap:clamp(9px,.9vw,16px);align-items:center;min-width:0;padding:0 clamp(9px,1vw,18px);background:#1a2530}
.tag{background:var(--gold);color:#171e22;font-weight:900;font-size:clamp(10px,.8vw,15px);white-space:nowrap;padding:6px 11px}.notice{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:clamp(12px,.9vw,17px);font-weight:750}
.demo-tag{color:#f8d5a2;border:1px solid #906b41;font-size:clamp(9px,.7vw,13px);padding:5px 7px;white-space:nowrap;font-weight:800}
.toolbar{position:fixed;z-index:10;left:50%;bottom:clamp(52px,6.5vh,78px);transform:translateX(-50%);display:flex;align-items:center;gap:5px;background:#283640e9;border:1px solid #60717c;padding:7px;border-radius:5px;box-shadow:0 10px 28px #0008}
.toolbar button{background:#1b2c37;color:#e8f1f3;border:1px solid #637986;border-radius:3px;padding:6px 9px;font-size:12px;white-space:nowrap}
.toolbar button[aria-pressed=true]{background:#68482b;border-color:#edb675;color:#ffe0b3}.toolbar[hidden]{display:none}
.toggle{position:fixed;z-index:10;right:15px;bottom:65px;background:#1f2c35;color:#f9d7a7;border:1px solid #69818d;padding:7px 9px;border-radius:3px;font-size:12px}
@media(min-width:1040px) and (max-width:1599px){
 header{grid-template-columns:minmax(170px,1fr) minmax(0,1.7fr) minmax(130px,.65fr)}
 .heading h1{font-size:clamp(20px,1.6vw,28px)}.lane{grid-template-columns:clamp(40px,4.3vw,68px) minmax(0,1fr) minmax(169px,39%);gap:7px;padding-inline:10px}
 .lane-id{width:clamp(39px,3.8vw,60px);height:clamp(50px,4.9vw,75px)}.identity strong{font-size:clamp(24px,2.35vw,40px)}
 .metric{padding-left:6px}.metric b{font-size:clamp(28px,2.4vw,44px)}.metric.duration b{font-size:clamp(17px,1.5vw,27px)}
 .timer{min-width:clamp(138px,12.6vw,200px)}.timer b{font-size:clamp(40px,3.6vw,63px)}
}
@media(min-width:1040px) and (max-height:830px){
 #shell{grid-template-rows:clamp(55px,7vh,69px) minmax(0,1fr) 38px;gap:6px}
 .left{grid-template-rows:minmax(0,1fr) clamp(85px,13vh,114px)}.stage{grid-template-rows:clamp(70px,9.2vh,83px) minmax(0,1fr) 27px}
 .stage-top{padding-block:3px}.timer{padding-block:2px}.timer b{font-size:clamp(39px,3.35vw,61px)}.round strong{font-size:clamp(37px,3.2vw,59px)}
 .board{grid-template-rows:clamp(43px,6vh,57px) minmax(0,1fr) 14px}.rows{padding-block:1px}
 .waiting{padding-block:6px;gap:4px}.wait-head strong{font-size:15px}.wait-info strong{font-size:clamp(13px,1vw,18px)}
}
@media(max-width:1039px){
 body{overflow:auto}#shell{height:auto;min-height:100dvh;grid-template-rows:auto auto auto;overflow:visible}.bodygrid,main{grid-template-columns:1fr;overflow:visible}
 header{display:flex;flex-wrap:wrap;gap:9px;padding:12px 0}.heading{order:3;justify-content:flex-start;flex:1 1 100%}.heading h1{font-size:clamp(19px,3.3vw,29px)}
 .time-now{margin-left:auto}.left{grid-template-rows:510px 128px}.stage{grid-template-rows:77px minmax(0,1fr) 34px}
 .lane{grid-template-columns:53px minmax(0,1fr) 36%;gap:8px}.identity strong{font-size:clamp(24px,3.5vw,39px)}
 .board{min-height:725px;grid-template-rows:62px minmax(0,1fr) 20px}.column{grid-template-rows:repeat(18,minmax(31px,1fr))}
 footer{min-height:48px}.toolbar{bottom:13px;flex-wrap:wrap;max-width:calc(100vw - 15px)}
}
@media(max-width:600px){
 .brand img{width:40px;height:40px}.brand-text strong{font-size:15px}.heading h1{font-size:19px}
 .left{grid-template-rows:466px 126px}.stage{grid-template-rows:68px minmax(0,1fr) 30px}.stage-top{padding-inline:7px;gap:4px}
 .round small{font-size:9px}.round strong{font-size:35px}.round em{font-size:9px}.timer{min-width:0;padding:2px 4px}.timer b{font-size:35px}.timer small{font-size:9px}.stage-meta{display:none}
 .lane{grid-template-columns:38px minmax(0,1fr) 37%;gap:5px;padding:7px 5px}.lane-id{width:36px;height:43px;font-size:29px}
 .identity small{font-size:8px}.identity strong{font-size:18px}.state{font-size:9px}
 .metric{padding-left:3px;gap:4px}.metric small{font-size:8px}.metric b{font-size:16px}.metric.duration b{font-size:10px}
 .wait-head strong{font-size:14px}.wait-head small{font-size:9px}.wait-team{padding:3px;gap:5px}.wait-info small{font-size:8px}.wait-info strong{font-size:11px}
 .board{min-height:700px;padding-inline:7px}.board-head strong{font-size:20px}.board-head small{font-size:9px}
 .rows{gap:9px}.rank{grid-template-columns:16px minmax(0,1fr) max-content;gap:2px;padding-inline:1px}.place,.name{font-size:9px}.rank.long .name{font-size:8px}.status{font-size:8px}
 .result{flex-direction:column;gap:1px;align-items:end}.result b{font-size:10px}.result small{font-size:8px;padding-left:0;border:0}
 .board-foot{font-size:8px}.demo-tag{font-size:8px;padding:3px}.notice{font-size:10px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

const teams=[{"order":1,"name":"哈雪大帽险","round":1,"lane":"A"},{"order":2,"name":"稀有队","round":1,"lane":"B"},{"order":3,"name":"一车九九九","round":2,"lane":"A"},{"order":4,"name":"阿塔浪队","round":2,"lane":"B"},{"order":5,"name":"老鼠洗完头","round":3,"lane":"A"},{"order":6,"name":"无言以对","round":3,"lane":"B"},{"order":7,"name":"宝宝巴士","round":4,"lane":"A"},{"order":8,"name":"迅风小队","round":4,"lane":"B"},{"order":9,"name":"如来佛组","round":5,"lane":"A"},{"order":10,"name":"组一辈子少男乐队","round":5,"lane":"B"},{"order":11,"name":"窝累铜泥丸","round":6,"lane":"A"},{"order":12,"name":"用户9527","round":6,"lane":"B"},{"order":13,"name":"友商都是**","round":7,"lane":"A"},{"order":14,"name":"我们说的都队","round":7,"lane":"B"},{"order":15,"name":"免费帮测灵根队","round":8,"lane":"A"},{"order":16,"name":"從來唔會輸","round":8,"lane":"B"},{"order":17,"name":"奶龙队","round":9,"lane":"A"},{"order":18,"name":"求针队","round":9,"lane":"B"},{"order":19,"name":"训狗大队","round":10,"lane":"A"},{"order":20,"name":"步履者","round":10,"lane":"B"},{"order":21,"name":"终极赛罗警卫队","round":11,"lane":"A"},{"order":22,"name":"666","round":11,"lane":"B"},{"order":23,"name":"超能鹿战队","round":12,"lane":"A"},{"order":24,"name":"你说的都队","round":12,"lane":"B"},{"order":25,"name":"华人青年队","round":13,"lane":"A"},{"order":26,"name":"陪跑队","round":13,"lane":"B"},{"order":27,"name":"今天吃点啥","round":14,"lane":"A"},{"order":28,"name":"Astralis","round":14,"lane":"B"},{"order":29,"name":"胜你无需第二遍队","round":15,"lane":"A"},{"order":30,"name":"猛攻队","round":15,"lane":"B"},{"order":31,"name":"三英战大车","round":16,"lane":"A"},{"order":32,"name":"凌云机创队","round":16,"lane":"B"},{"order":33,"name":"果宝机甲队","round":17,"lane":"A"},{"order":34,"name":"图灵测试队","round":17,"lane":"B"},{"order":35,"name":"胆子肥嘟嘟队","round":18,"lane":"A"},{"order":36,"name":"爱拼才会赢队","round":18,"lane":"B"}];
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const fmt=t=>t==null?'--:--.--':pad(Math.floor(t/60000))+':'+pad(Math.floor(t/1000)%60)+'.'+pad(Math.floor(t%1000/10));
const scores=teams.map((x,i)=>({...x,score:+(99-i*1.22+(i%3)*.13).toFixed(2),ms:82100+i*1780}));
let scene='upcoming',round=1,remain=240;
function scored(){return scene==='upcoming'?[]:scene==='live'||scene==='warning'?scores.slice(0,6):scene==='finished'?scores.slice(0,22):scores.slice();}
function list(){const a=scored().sort((x,y)=>y.score-x.score||x.ms-y.ms);const set=new Set(a.map(x=>x.order));return [...a,...teams.filter(x=>!set.has(x.order))];}
function lane(key){
 const t=teams.find(x=>x.round===round&&x.lane===key),done=scored().find(x=>x.order===t?.order);
 const running=scene==='live'||scene==='warning',status=done?'已完成':running?'比赛进行中':scene==='upcoming'?'等待上场':'已完成';
 const state=done?'done':running?'run':'';
 return '<span class="lane-id">'+key+'</span><div class="identity"><small>第'+pad(t?.order||0)+' 签位 / 第'+pad(round)+'轮</small><strong class="'+((t?.name||'').length>10?'long':'')+'">'+escapeHtml(t?.name||'等待安排')+'</strong><span class="state '+state+'">'+status+'</span></div><div class="metrics"><div class="metric"><small>本轮得分</small><b class="'+(!done?'placeholder':'')+'">'+(done?done.score.toFixed(2):'---')+'</b></div><div class="metric duration"><small>完成用时</small><b class="'+(!done?'placeholder':'')+'">'+fmt(done?.ms)+'</b></div></div>';
}
function waiting(key){const t=teams.find(x=>x.round===round+1&&x.lane===key);return '<span class="wait-letter">'+key+'</span><span class="wait-info"><small>'+key+'赛道 · 下一轮</small><strong>'+escapeHtml(t?.name||'正赛结束')+'</strong></span>';}
function rank(t,i){
 const done=t.score!==undefined,play=t.round===round&&(scene==='upcoming'||scene==='live'||scene==='warning'),next=t.round===round+1;
 const cls=(done?'done':'pending')+(play?' '+t.lane.toLowerCase():next?' waiting':'')+(done&&i<3?' medal-'+(i+1):'')+([...t.name].length>11?' long':'');
 const status=play?'本轮'+t.lane:next?'候场':'待赛';
 return '<div class="rank '+cls+'"><span class="place">'+pad(done?i+1:t.order)+'</span><span class="name" title="'+escapeHtml(t.name)+'">'+escapeHtml(t.name)+'</span>'+(done?'<span class="result"><b>'+t.score.toFixed(2)+'</b><small>'+fmt(t.ms)+'</small></span>':'<span class="status">'+status+'</span>')+'</div>';
}
function paint(){
 round=scene==='upcoming'?1:scene==='live'||scene==='warning'?4:scene==='finished'?12:18;
 $('roundName').textContent=scene==='upcoming'?'待开赛':scene==='live'||scene==='warning'?'比赛进行中':scene==='finished'?'成绩核对':'颁奖公布';
 $('round').textContent=pad(round);
 $('laneA').innerHTML=lane('A');$('laneB').innerHTML=lane('B');$('nextA').innerHTML=waiting('A');$('nextB').innerHTML=waiting('B');
 const a=list();$('rows').innerHTML=[0,1].map(k=>'<section class="column">'+a.slice(k*18,(k+1)*18).map((t,i)=>rank(t,k*18+i)).join('')+'</section>').join('');
 $('count').textContent='已录分 '+scored().length+' / 36';
 $('progress').innerHTML=Array.from({length:18},(_,i)=>'<i class="'+(i+1<round?'done':i+1===round?'current':'')+'"></i>').join('');
 const hints={upcoming:'第一组赛前调试4分钟，请提前准备',live:'第4轮比赛进行中，下一轮选手请前往调试区',warning:'本轮剩余25秒，请注意赛道安全',finished:'当前已有22队完成录分，进入成绩复核',awards:'模拟颁奖场景：已完成全部比赛'};
 $('hint').textContent=hints[scene];$('notice').textContent=hints[scene];
 tick();
}
function tick(){
 const time=new Date();$('now').textContent=[time.getHours(),time.getMinutes(),time.getSeconds()].map(pad).join(':');
 const live=scene==='live'||scene==='warning';const expired=live&&remain<=0;
 $('timerLabel').textContent=scene==='upcoming'?'等待比赛开始':scene==='finished'?'成绩复核':scene==='awards'?'获奖公布':expired?'本轮时间到':remain<=10?'最后10秒':remain<=30?'最后30秒':'本轮倒计时';
 $('timer').textContent=live?pad(Math.floor(remain/60))+':'+pad(remain%60):scene==='upcoming'?'04:00':'00:00';
 $('timerBox').classList.toggle('warn',live&&remain<=30&&remain>10);$('timerBox').classList.toggle('critical',live&&remain<=10);
 $('fill').style.transform='scaleX('+(live?remain/240:scene==='upcoming'?1:0)+')';
}
function setScene(x){
 scene=x;remain=x==='warning'?25:x==='live'?200:x==='upcoming'?240:0;
 document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scene===x)));
 paint();
}
document.querySelectorAll('[data-scene]').forEach(b=>b.addEventListener('click',()=>setScene(b.dataset.scene)));
$('toggleTool').addEventListener('click',()=>{const panel=$('tool'),show=panel.hidden;panel.hidden=!show;$('toggleTool').textContent=show?'隐藏工具':'显示工具'});
$('fullscreen').addEventListener('click',()=>document.documentElement.requestFullscreen?.().catch(()=>{}));
let last=performance.now();setInterval(()=>{const now=performance.now(),dt=now-last;last=now;if((scene==='live'||scene==='warning')&&document.visibilityState==='visible')remain=Math.max(0,remain-Math.round(dt/1000));tick()},1000);
paint();
</script></body></html>
