<div id="shell"><header><div class="brand"><img src="../assets/lab-logo-transparent.svg" alt="江苏科技大学机械创新实验室 Logo"><div class="brand-text"><small>江苏科技大学</small><strong>机械创新实验室</strong></div></div><div class="heading"><h1>智能搬运小车创新挑战赛</h1><small>2026 校内赛</small></div><time class="time-now" id="now">--:--:--</time></header>

<footer><strong class="tag">现场调度</strong><span class="notice" id="notice"></span><span class="demo-tag">仅供设计预览 · 非正式数据</span></footer></div>

'use strict';
const teams=[{"order":1,"name":"哈雪大帽险","round":1,"lane":"A"},{"order":2,"name":"稀有队","round":1,"lane":"B"},{"order":3,"name":"一车九九九","round":2,"lane":"A"},{"order":4,"name":"阿塔浪队","round":2,"lane":"B"},{"order":5,"name":"老鼠洗完头","round":3,"lane":"A"},{"order":6,"name":"无言以对","round":3,"lane":"B"},{"order":7,"name":"宝宝巴士","round":4,"lane":"A"},{"order":8,"name":"迅风小队","round":4,"lane":"B"},{"order":9,"name":"如来佛组","round":5,"lane":"A"},{"order":10,"name":"组一辈子少男乐队","round":5,"lane":"B"},{"order":11,"name":"窝累铜泥丸","round":6,"lane":"A"},{"order":12,"name":"用户9527","round":6,"lane":"B"},{"order":13,"name":"友商都是**","round":7,"lane":"A"},{"order":14,"name":"我们说的都队","round":7,"lane":"B"},{"order":15,"name":"免费帮测灵根队","round":8,"lane":"A"},{"order":16,"name":"從來唔會輸","round":8,"lane":"B"},{"order":17,"name":"奶龙队","round":9,"lane":"A"},{"order":18,"name":"求针队","round":9,"lane":"B"},{"order":19,"name":"训狗大队","round":10,"lane":"A"},{"order":20,"name":"步履者","round":10,"lane":"B"},{"order":21,"name":"终极赛罗警卫队","round":11,"lane":"A"},{"order":22,"name":"666","round":11,"lane":"B"},{"order":23,"name":"超能鹿战队","round":12,"lane":"A"},{"order":24,"name":"你说的都队","round":12,"lane":"B"},{"order":25,"name":"华人青年队","round":13,"lane":"A"},{"order":26,"name":"陪跑队","round":13,"lane":"B"},{"order":27,"name":"今天吃点啥","round":14,"lane":"A"},{"order":28,"name":"Astralis","round":14,"lane":"B"},{"order":29,"name":"胜你无需第二遍队","round":15,"lane":"A"},{"order":30,"name":"猛攻队","round":15,"lane":"B"},{"order":31,"name":"三英战大车","round":16,"lane":"A"},{"order":32,"name":"凌云机创队","round":16,"lane":"B"},{"order":33,"name":"果宝机甲队","round":17,"lane":"A"},{"order":34,"name":"图灵测试队","round":17,"lane":"B"},{"order":35,"name":"胆子肥嘟嘟队","round":18,"lane":"A"},{"order":36,"name":"爱拼才会赢队","round":18,"lane":"B"}];

const fmt=t=>t==null?'--:--.--':pad(Math.floor(t/60000))+':'+pad(Math.floor(t/1000)%60)+'.'+pad(Math.floor(t%1000/10));
const scores=teams.map((x,i)=>({...x,score:+(99-i*1.22+(i%3)*.13).toFixed(2),ms:82100+i*1780}));
let scene='upcoming',round=1,remain=240;
function scored(){return scene==='upcoming'?[]:scene==='live'||scene==='warning'?scores.slice(0,6):scene==='finished'?scores.slice(0,22):scores.slice();}
function list(){const a=scored().sort((x,y)=>y.score-x.score||x.ms-y.ms);const set=new Set(a.map(x=>x.order));return [...a,...teams.filter(x=>!set.has(x.order))];}
function lane(key){
 const t=teams.find(x=>x.round===round&&x.lane===key),done=scored().find(x=>x.order===t?.order);
 const running=scene==='live'||scene==='warning',status=done?'已完成':running?'比赛进行中':scene==='upcoming'?'等待上场':'已完成';
 const state=done?'done':running?'run':'';
 return '<span class="lane-id">'+key+'</span><div class="identity"><small>第'+pad(t?.order||0)+' 签位 / 第'+pad(round)+'轮</small><strong class="'+((t?.name||'').length>10?'long':'')+'">'+escapeHtml(t?.name||'等待安排')+'</strong><span class="state '+state+'">'+status+'</span></div><div class="metrics"><div class="metric"><small>本轮得分</small><b class="'+(!done?'placeholder':'')+'">'+(done?done.score.toFixed(2):'---')+'</b></div><div class="metric duration"><small>完成用时</small><b class="'+(!done?'placeholder':'')+'">'+fmt(done?.ms)+'</b></div></div>';
}
function waiting(key){const t=teams.find(x=>x.round===round+1&&x.lane===key);return '<span class="wait-letter">'+key+'</span><span class="wait-info"><small>'+key+'赛道 · 下一轮</small><strong>'+escapeHtml(t?.name||'正赛结束')+'</strong></span>';}
function rank(t,i){
 const done=t.score!==undefined,play=t.round===round&&(scene==='upcoming'||scene==='live'||scene==='warning'),next=t.round===round+1;
 const cls=(done?'done':'pending')+(play?' '+t.lane.toLowerCase():next?' waiting':'')+(done&&i<3?' medal-'+(i+1):'')+([...t.name].length>11?' long':'');
 const status=play?'本轮'+t.lane:next?'候场':'待赛';
 return '<div class="rank '+cls+'"><span class="place">'+pad(done?i+1:t.order)+'</span><span class="name" title="'+escapeHtml(t.name)+'">'+escapeHtml(t.name)+'</span>'+(done?'<span class="result"><b>'+t.score.toFixed(2)+'</b><small>'+fmt(t.ms)+'</small></span>':'<span class="status">'+status+'</span>')+'</div>';
}
function paint(){
 round=scene==='upcoming'?1:scene==='live'||scene==='warning'?4:scene==='finished'?12:18;
 $('roundName').textContent=scene==='upcoming'?'待开赛':scene==='live'||scene==='warning'?'比赛进行中':scene==='finished'?'成绩核对':'颁奖公布';
 $('round').textContent=pad(round);
 $('laneA').innerHTML=lane('A');$('laneB').innerHTML=lane('B');$('nextA').innerHTML=waiting('A');$('nextB').innerHTML=waiting('B');
 const a=list();$('rows').innerHTML=[0,1].map(k=>'<section class="column">'+a.slice(k*18,(k+1)*18).map((t,i)=>rank(t,k*18+i)).join('')+'</section>').join('');
 $('count').textContent='已录分 '+scored().length+' / 36';
 $('progress').innerHTML=Array.from({length:18},(_,i)=>'<i class="'+(i+1<round?'done':i+1===round?'current':'')+'"></i>').join('');
 const hints={upcoming:'第一组赛前调试4分钟，请提前准备',live:'第4轮比赛进行中，下一轮选手请前往调试区',warning:'本轮剩余25秒，请注意赛道安全',finished:'当前已有22队完成录分，进入成绩复核',awards:'模拟颁奖场景：已完成全部比赛'};
 $('hint').textContent=hints[scene];$('notice').textContent=hints[scene];
 tick();
}
function tick(){
 const time=new Date();$('now').textContent=[time.getHours(),time.getMinutes(),time.getSeconds()].map(pad).join(':');
 const live=scene==='live'||scene==='warning';const expired=live&&remain<=0;
 $('timerLabel').textContent=scene==='upcoming'?'等待比赛开始':scene==='finished'?'成绩复核':scene==='awards'?'获奖公布':expired?'本轮时间到':remain<=10?'最后10秒':remain<=30?'最后30秒':'本轮倒计时';
 $('timer').textContent=live?pad(Math.floor(remain/60))+':'+pad(remain%60):scene==='upcoming'?'04:00':'00:00';
 $('timerBox').classList.toggle('warn',live&&remain<=30&&remain>10);$('timerBox').classList.toggle('critical',live&&remain<=10);
 $('fill').style.transform='scaleX('+(live?remain/240:scene==='upcoming'?1:0)+')';
}
function setScene(x){
 scene=x;remain=x==='warning'?25:x==='live'?200:x==='upcoming'?240:0;
 document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scene===x)));
 paint();
}
document.querySelectorAll('[data-scene]').forEach(b=>b.addEventListener('click',()=>setScene(b.dataset.scene)));
$('toggleTool').addEventListener('click',()=>{const panel=$('tool'),show=panel.hidden;panel.hidden=!show;$('toggleTool').textContent=show?'隐藏工具':'显示工具'});
$('fullscreen').addEventListener('click',()=>document.documentElement.requestFullscreen?.().catch(()=>{}));
let last=performance.now();setInterval(()=>{const now=performance.now(),dt=now-last;last=now;if((scene==='live'||scene==='warning')&&document.visibilityState==='visible')remain=Math.max(0,remain-Math.round(dt/1000));tick()},1000);
paint();
</script></body></html>
