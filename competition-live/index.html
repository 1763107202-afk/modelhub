 <a class="brand" href="#screen" aria-label="赛事大屏"><span class="brand-icon">↗</span><span class="brand-lines"><strong>MOVE<span class="brand-punct">.</span>ARENA</strong><small>智能搬运小车 · 2026 校内挑战赛</small></span></a>
 <nav class="nav"><button data-nav="screen" class="selected">大屏 LIVE</button><button data-nav="judge">裁判录分</button><button data-nav="control">赛事总控</button></nav>
 <div class="top-right"><span class="connection" id="connection"><span class="pulse-dot"></span><span id="connectionText">正在连接</span></span><span id="clock" class="clock">--:--:--</span></div>
</header>
<div id="message" class="toast" role="status" aria-live="polite"></div>
<main id="app" class="shell"><section class="loading"><div class="spinner"></div><p>正在加载实时赛事数据</p></section></main>
<div id="awardOverlay" class="award-overlay hidden" role="dialog" aria-modal="true" aria-label="比赛颁奖揭晓"><button class="overlay-close" id="closeAwards">✕ 退出颁奖</button><div id="awardContent" class="award-content"></div></div>
<script>/* MOVE.ARENA · 独立比赛直播应用。无第三方 JS 依赖；与主站完全隔离。 */
(() => {
'use strict';
const C = window.COMP26_CONFIG;
const SLUG = C.slug;
const demoMode = new URLSearchParams(location.search).has('demo');
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const nowTime = ()=>new Date().toLocaleTimeString('zh-CN',{hour12:false});
const phaseText={upcoming:'等待开赛',live:'比赛进行中',retry:'故障顺延补赛',review:'成绩复核中',awards:'颁奖进行中',closed:'比赛结束'};
const state={view:'screen',event:null,teams:[],role:sessionStorage.getItem('comp26_role')||'',token:sessionStorage.getItem('comp26_token')||'',lastSnapshot:'',loading:false,pollError:false,lastUpdate:0,awardOpened:false,demo:demoMode};
const toast=(msg,bad=false)=>{const el=$('message');el.textContent=msg;el.className='toast visible'+(bad?' bad':'');clearTimeout(window._toastTimeout);window._toastTimeout=setTimeout(()=>el.classList.remove('visible'),4000)};
const roleText = {admin:'赛事总管理员',judge_a:'A赛道裁判',judge_b:'B赛道裁判'};
const req=async(path,options={})=>{
 const response=await fetch(C.projectUrl+'/rest/v1/'+path,{...options,headers:{apikey:C.publishableKey,...options.headers}});
 const body=await response.text();let json;try{json=body?JSON.parse(body):null}catch{json=body}
 if(!response.ok)throw Error(json?.message||json?.hint||JSON.stringify(json)||'网络请求失败');return json;
};
const rpc=async(action,data={})=>{
 if(demoMode)return demoAction(action,data);
 if(!state.token)throw Error('请先输入裁判或管理员访问码');
 return req('rpc/comp26_action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({p_secret:state.token,p_action:action,...data})});
};
function prepareDemo(){
 const existing=localStorage.getItem('comp26_demo');
 if(existing){try{const x=JSON.parse(existing);if(x.teams?.length===36){state.event=x.event;state.teams=x.teams;return;}}catch{}}
 state.event={id:'demo',current_round:4,phase:'live',awards_revealed:false,active_retry_team:null,announcement:'有请第4轮：宝宝巴士、迅风小队！',round_started_at:new Date().toISOString()};
 state.teams=window.COMP26_TEAMS.map((t,i)=>({...t,id:'team-'+(i+1),draw_order:t.order,round_no:t.round,lane:t.lane,status:i<6?'scored':'pending',score:i<6?Number((80+(i*7)%18+(i*.23)).toFixed(2)):null,attempt_count:1,tie_order:null,note:''}));
 localStorage.setItem('comp26_demo',JSON.stringify({event:state.event,teams:state.teams}));
}
function persistDemo(){localStorage.setItem('comp26_demo',JSON.stringify({event:state.event,teams:state.teams}))}
function demoAction(action,d={}){
 const e=state.event,t=state.teams.find(x=>x.id===d.p_team_id);const err=m=>{throw Error(m)};
 if(action==='probe')return {ok:true,role:state.role||'admin'};
 if(action==='start'){e.phase='live';e.current_round=1;e.round_started_at=new Date().toISOString();state.teams.forEach(x=>{x.status='pending';x.score=null;x.attempt_count=1})}
 else if(action==='submit'){if(!t)err('队伍不存在');t.score=Number(d.p_score);t.status=e.phase==='retry'?'retry_scored':'scored';t.note=d.p_note||'';if(e.phase==='retry')e.active_retry_team=null}
 else if(action==='fault'){if(!t)err('队伍不存在');t.status='fault_pending';t.note=d.p_note||'硬件临时故障'}
 else if(action==='mark_dnf'||action==='retry_fail'){t.score=0;t.status='dnf';e.active_retry_team=null}
 else if(action==='next'){const pending=state.teams.filter(x=>x.round_no===e.current_round&&!['scored','fault_pending','dnf'].includes(x.status));if(pending.length)err('本轮仍有未确认队伍');if(e.current_round<18){e.current_round++;e.announcement='有请第'+e.current_round+'轮！';e.round_started_at=new Date().toISOString()}else{e.phase=state.teams.some(x=>x.status==='fault_pending')?'retry':'review';e.announcement='正赛结束，进入成绩核对'}}
 else if(action==='activate_retry'){t.status='retry_active';t.attempt_count=2;e.active_retry_team=t.id;e.announcement='补赛：'+t.name}
 else if(action==='finish_retries'){e.phase='review';e.announcement='正在核对获奖名单'}
 else if(action==='tie'){t.tie_order=d.p_tie}
 else if(action==='reveal'){if(state.teams.some(x=>x.score===null))err('请完成所有队伍评分');e.phase='awards';e.awards_revealed=true;e.announcement='获奖名单正式揭晓！'}
 else if(action==='announce'){e.announcement=d.p_note}
 persistDemo();return {ok:true};
}
async function refresh(force=false){
 if(state.loading)return;state.loading=true;
 try{
  if(demoMode){if(!state.event)prepareDemo();}
  else{
   const events=await req('comp26_events?select=*&slug=eq.'+encodeURIComponent(SLUG));
   if(!events?.length)throw Error('比赛数据尚未部署，请先运行 schema.sql');
   const event=events[0];const teams=await req('comp26_teams?select=*&event_id=eq.'+encodeURIComponent(event.id)+'&order=draw_order.asc');
   state.event=event;state.teams=teams;
  }
  const old=state.lastSnapshot;const snapshot=JSON.stringify([state.event,state.teams]);state.lastSnapshot=snapshot;
  const wentLive=old&&state.event.awards_revealed&&!state.awardOpened&&!sessionStorage.getItem('comp26_skip_awards');
  if(force||snapshot!==old){
   if(document.activeElement?.matches('input,textarea')&&!force){/* 不打断裁判手机填写 */}
   else render();
  }
  if(wentLive&&state.view==='screen'){state.awardOpened=true;showAwards();}
  state.pollError=false;state.lastUpdate=Date.now();connection(true);
 }catch(err){state.pollError=true;connection(false);if(force){$('app').innerHTML=`<section class="panel key-panel"><div class="eyebrow">连接失败</div><h2>无法加载赛事数据</h2><p class="subtext">${esc(err.message)}</p><button class="btn" id="retryConnect">重试连接</button><p class="tiny-note">可在地址末尾加 ?demo=1 进入可操作的演示模式（仅当前设备，不会同步）。</p></section>`;$('retryConnect').onclick=()=>refresh(true)} }
 finally{state.loading=false;}
}
function connection(ok){const el=$('connection');el.classList.toggle('bad',!ok);$('connectionText').textContent=demoMode?'本机演示':ok?'赛事数据已同步':'连接中断 · 正在重连';}
function setView(view){if(!['screen','judge','control'].includes(view))view='screen';state.view=view;location.hash='#'+view;document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('selected',b.dataset.nav===view));render();}
function sortRank(){return state.teams.filter(x=>x.score!==null).slice().sort((a,b)=>Number(b.score)-Number(a.score)||(a.tie_order??99999)-(b.tie_order??99999)||a.draw_order-b.draw_order)}
function rankNum(list,i){return list.findIndex(x=>x.score===list[i].score)+1}
const roundTeams=(n)=>state.teams.filter(t=>t.round_no===n);
const displayedScore=t=>t?.score===null?'—':Number(t?.score||0).toFixed(2);
const teamStatus=t=>!t?'':({pending:'等待上场',scored:'成绩已确认',fault_pending:'硬件故障 · 待补赛',retry_active:'补赛进行中',retry_scored:'补赛成绩已确认',dnf:'未完成'}[t.status]||t.status);
const screenPhase=e=>e.phase==='upcoming'?'比赛倒计时 / 待开赛':e.phase==='live'?'ROUND IN PROGRESS':e.phase==='retry'?'TECHNICAL RETRY':e.phase==='review'?'RESULTS UNDER REVIEW':'AWARD CEREMONY';
const footer=()=>`<footer class="footer"><span>2026 SMART TRANSPORT CHALLENGE · 双赛道 / 36队 / 18轮</span><span>${demoMode?'⚠ 演示数据仅用于本地操作，不代表真实成绩':'数据来自赛事云端 · 总分依据裁判评分规则录入'}</span></footer>`;
function screen(){const e=state.event,a=roundTeams(e.current_round)[0],b=roundTeams(e.current_round)[1];const next=roundTeams(e.current_round+1);const ranked=sortRank();const finished=state.teams.filter(t=>t.score!==null).length;
 const actionHint= e.phase==='live'&&roundTeams(e.current_round).every(t=>['scored','fault_pending','dnf'].includes(t.status))?'两条赛道已确认 · 有请下一组准备就位':e.phase==='live'?'当前轮进行中 · 下一组请至调试区准备':e.phase==='upcoming'?'第一组赛前单独调试 4 分钟':phaseText[e.phase];
 return `<div class="hero-row"><div><div class="eyebrow">LIVE COMPETITION · NOV 22, 2026</div><h1 class="hero-title">智能搬运<em>挑战赛</em></h1><p class="subtext">36支队伍 · 两条赛道同步竞赛 · 每轮4分钟</p></div><span class="status-tag ${e.phase==='upcoming'?'scheduled':e.phase==='awards'?'awards':''}">${esc(phaseText[e.phase])}</span></div>
 <div class="notice-strip"><b>◉ LIVE UPDATE</b><span>${esc(e.announcement)}</span></div>
 <div class="metrics" style="margin:20px 0"><div class="metric"><span>总参赛队伍</span><strong>36 <small style="font-size:14px">TEAMS</small></strong></div><div class="metric"><span>已确认成绩</span><strong class="accent">${finished} <small style="font-size:14px">/ 36</small></strong></div><div class="metric"><span>当前轮次</span><strong class="lime">${pad(e.current_round)} <small style="font-size:14px">/ 18</small></strong></div><div class="metric"><span>故障待补赛</span><strong>${state.teams.filter(t=>['fault_pending','retry_active'].includes(t.status)).length} <small style="font-size:14px">队</small></strong></div></div>
 <div class="dashboard"><div class="left-side"><section class="panel round-hero"><div class="round-top"><div><span class="eyebrow">${screenPhase(e)}</span><h2 class="round-number">${pad(e.current_round)}<small>/ 18 ROUNDS</small></h2></div><div class="timer-wrap"><div class="timer" id="roundTimer">04:00</div><div class="timer-note">当前轮参考倒计时</div></div></div>
 <div class="lanes">${[a,b].map((t,i)=>`<div class="lane-card"><div class="lane-id ${i?'b':''}">▰ LANE ${i?'B':'A'}</div><div class="lane-name">${esc(t?.name)}</div><div class="lane-detail"><span class="mini-pill">${esc(teamStatus(t))}</span>${t?.score!==null?`<span class="lane-score">${displayedScore(t)} <small style="font:12px sans-serif;color:#90b7bb">PTS</small></span>`:''}</div></div>`).join('')}</div><div class="scene-note">${esc(actionHint)}</div></section>
 <section class="panel"><div class="panel-head"><span class="panel-title">下一轮 · 调试区同步准备</span><span class="eyebrow">4 MIN SETUP</span></div><div class="next-block">${next.length?next.map(t=>`<div class="next-team ${t.lane==='B'?'b':''}"><span>LANE ${t.lane} / 第 ${pad(t.round_no)} 轮</span><strong>${esc(t.name)}</strong></div>`).join(''):'<div class="subtext">已到最后一轮。正赛结束后如有硬件故障，将统一安排一次补赛。</div>'}</div></section>
 <section class="panel"><div class="panel-head"><span class="panel-title">18轮比赛进度</span><span class="eyebrow">RACE TIMELINE</span></div><div class="all-rounds">${Array.from({length:18},(_,i)=>{const arr=roundTeams(i+1);return `<div class="round-mini ${e.current_round===i+1?'active':''}"><span>${pad(i+1)}</span><small>${esc(arr[0]?.name)}</small><small>${esc(arr[1]?.name)}</small><span class="score-mini">${arr.filter(t=>t.score!==null).length}/2</span></div>`}).join('')}</div></section></div>
 <aside class="right-side"><section class="panel"><div class="panel-head"><span class="panel-title">实时积分排行榜</span><span class="eyebrow">LIVE RANKING</span></div><div class="ranking-list">${ranked.length?ranked.slice(0,12).map((t,i)=>`<div class="rank-item ${i===0?'top1':''}"><span class="rank-no">${pad(rankNum(ranked,i))}</span><span class="rank-name">${esc(t.name)}</span><span class="rank-score">${displayedScore(t)}</span></div>`).join(''):'<p class="subtext">首轮成绩确认后，这里将自动更新实时排名。</p>'}</div><p class="tiny-note">仅已确认成绩进入排名，同分并列显示；最终奖项以裁判审核为准。</p></section>
 <section class="panel"><div class="panel-head"><span class="panel-title">赛事完成度</span><span class="eyebrow">PROGRESS</span></div><div style="display:flex;justify-content:space-between;align-items:end"><strong style="font:900 47px var(--font-display);color:var(--cyan)">${Math.round(finished/36*100)}%</strong><span class="subtext">${finished} / 36 已确认</span></div><div class="progress-track"><div class="progress-fill" style="width:${finished/36*100}%"></div></div><div class="btns" style="margin-top:20px"><button class="btn" id="openFullscreen">⛶ 全屏展示</button>${e.awards_revealed?'<button class="btn lime" id="openAwards">★ 重新播放颁奖</button>':''}</div></section></aside></div>${footer()}`;
}
function login(){return `<section class="panel key-panel"><div class="eyebrow">SECURE OFFICIAL ACCESS</div><h2>赛事权限验证</h2><p class="subtext">裁判与总控使用不同的专属访问码。大屏无需登录，即可查看实时赛事排名。访问码不会写入网页源码，当前窗口关闭后可清除会话。</p><form id="authForm"><div class="field"><label for="accessCode">管理员 / A赛道 / B赛道访问码</label><input type="password" id="accessCode" autocomplete="off" placeholder="输入组委会提供的专属访问码" required minlength="24"></div><button type="submit" class="btn primary block big">验证并进入工作台 →</button></form>${demoMode?'<p class="tiny-note">演示模式：任意填写24字符以上内容即可进入；演示不会上传真实成绩。</p>':''}<p class="tiny-note">请勿将访问码发送到群聊或写在网页 URL 中；裁判只可操作对应赛道，管理员负责下一轮和最终揭晓。</p></section>`}
function editor(t){return `<section class="judge-card"><div class="judge-title">LANE ${esc(t.lane)} · 第 ${pad(t.round_no)} 轮</div><div class="judge-team">${esc(t.name)}</div><div class="subtext">${esc(teamStatus(t))} · 当前录入成绩：<strong style="color:var(--lime)">${displayedScore(t)}</strong></div>
 <form id="scoreForm"><input type="hidden" id="currentTeamId" value="${esc(t.id)}"><div class="field" style="margin:18px 0"><label for="scoreInput">最终得分 · POINTS（依据现场评分表）</label><input id="scoreInput" type="number" inputmode="decimal" min="0" max="9999" step="0.01" value="${t.score===null?'':Number(t.score)}" placeholder="例如 92.50" required></div><div class="field" style="margin-bottom:17px"><label for="scoreNote">备注 / 扣分依据（选填）</label><textarea id="scoreNote" maxlength="240" placeholder="例如：超时、漏放、裁判确认情况">${esc(t.note||'')}</textarea></div><button type="submit" class="btn lime big block">✓ 确认提交本队成绩</button></form>
 <div class="btns" style="margin-top:12px"><button class="btn danger block" id="faultBtn" ${t.status!=='pending'?'disabled':''}>⚠ 临时硬件故障 · 申请顺延一次</button></div><p class="tiny-note">提交后立即同步大屏与排行榜；因操作失误需要修正的成绩仅可在该轮结束前重新提交。故障顺延由裁判现场确认，补赛仅一次。</p></section>`}
function judge(){if(!state.token)return login();const e=state.event;const lane=state.role==='judge_a'?'A':state.role==='judge_b'?'B':'A';const active=e.phase==='retry'?state.teams.find(t=>t.id===e.active_retry_team && (state.role==='admin'||t.lane===lane)):roundTeams(e.current_round).find(t=>t.lane===lane);
 const allowed=e.phase==='live'&&active||e.phase==='retry'&&active;const canSubmit=allowed&&(active.status==='pending'||active.status==='scored'||active.status==='retry_active');
 return `<div class="hero-row"><div><div class="eyebrow">JUDGE CONSOLE · MOBILE READY</div><h1 class="heading">裁判实时录分台</h1><p class="subtext">提交后全场屏幕约2秒同步更新 · 第 ${pad(e.current_round)} 轮 · ${esc(phaseText[e.phase])}</p></div><span class="role-chip">${esc(roleText[state.role])}</span></div><div class="admin-layout"><div class="flex-col">${canSubmit?editor(active):`<section class="panel"><div class="eyebrow">STANDBY</div><h2>${esc(phaseText[e.phase])}</h2><p class="subtext">${active?`${esc(active.name)} · ${esc(teamStatus(active))}`:'当前没有需要本裁判录分的队伍。'}</p>${active?.score!==null?`<strong class="lane-score">${displayedScore(active)} PTS</strong>`:''}</section>`}<div class="notice-strip"><b>赛事广播</b>${esc(e.announcement)}</div></div>
 <div class="flex-col"><section class="panel"><div class="panel-head"><span class="panel-title">本轮双赛道状态</span><span class="eyebrow">ROUND ${pad(e.current_round)}</span></div><div class="team-list">${roundTeams(e.current_round).map(t=>`<div class="team-entry"><div><strong>LANE ${t.lane} · ${esc(t.name)}</strong><small>${esc(teamStatus(t))}</small></div><span class="score">${displayedScore(t)}</span></div>`).join('')}</div></section><section class="panel"><div class="panel-head"><span class="panel-title">下一轮候赛区</span><span class="eyebrow">NEXT UP</span></div>${roundTeams(e.current_round+1).map(t=>`<p class="subtext">${t.lane} 赛道　<strong style="color:#eaf8ff">${esc(t.name)}</strong></p>`).join('')||'<p class="subtext">正赛即将结束，等待补赛。</p>'}</section><button class="btn ghost" id="logoutBtn">退出当前裁判账号</button></div></div>${footer()}`;
}
function control(){if(!state.token)return login();if(state.role!=='admin')return `<section class="panel key-panel"><div class="eyebrow">ACCESS DENIED</div><h2>需要赛事管理员权限</h2><p class="subtext">当前为 ${esc(roleText[state.role])}。裁判请使用录分台，只有管理员可以切换下一轮和公布奖项。</p><button class="btn" id="logoutBtn">换一个访问码</button></section>`;
 const e=state.event,arr=roundTeams(e.current_round),ranked=sortRank();const pending=arr.filter(t=>!['scored','fault_pending','dnf'].includes(t.status));const faults=state.teams.filter(t=>['fault_pending','retry_active'].includes(t.status));const allScored=state.teams.every(t=>t.score!==null);
 return `<div class="hero-row"><div><div class="eyebrow">EVENT CONTROL CENTER</div><h1 class="heading">赛事总控指挥台</h1><p class="subtext">只允许管理员执行开赛、切轮、故障安排与获奖揭晓；所有操作在云端记录。</p></div><span class="role-chip">ADMIN ONLY</span></div>
 <div class="metrics" style="margin-bottom:20px"><div class="metric"><span>当前阶段</span><strong style="font:800 19px sans-serif">${esc(phaseText[e.phase])}</strong></div><div class="metric"><span>比赛轮次</span><strong class="accent">${pad(e.current_round)} /18</strong></div><div class="metric"><span>已确认成绩</span><strong class="lime">${state.teams.filter(t=>t.score!==null).length} /36</strong></div><div class="metric"><span>补赛待处理</span><strong>${faults.length}</strong></div></div>
 <div class="admin-layout"><div class="flex-col"><section class="panel"><div class="panel-head"><span class="panel-title">比赛进程管理</span><span class="eyebrow">RACE OPERATIONS</span></div><div class="stage-card"><div><span class="eyebrow">CURRENT ROUND</span><h2>第 ${pad(e.current_round)} 轮 · ${esc(phaseText[e.phase])}</h2><p class="subtext">A ${esc(arr[0]?.name)} ／ B ${esc(arr[1]?.name)}</p></div><span class="status-tag">${arr.length-pending.length}/2 已确认</span></div><div class="btns" style="margin-top:17px">${e.phase==='upcoming'?'<button class="btn primary big" data-action="start">▶ 宣布正式开始比赛</button>':''}${e.phase==='live'?`<button class="btn primary big" data-action="next" ${pending.length?'disabled':''}>${e.current_round===18?'✓ 结束18轮正赛':'➜ 确认成绩 · 有请下一组'}</button>`:''}${e.phase==='retry'?'<button class="btn lime" data-action="finish_retries" '+(faults.length?'disabled':'')+'>✓ 全部补赛完成 · 开始核对奖项</button>':''}</div>${pending.length&&e.phase==='live'?`<p class="tiny-note">还需处理：${pending.map(t=>esc(t.name)).join('、')}。录分、申报故障或标记未完成后才能切轮。</p>`:''}</section>
 <section class="panel"><div class="panel-head"><span class="panel-title">当前赛道裁判复核</span><span class="eyebrow">LANE STATUS</span></div><div class="team-list">${arr.map(t=>`<div class="team-entry"><div><strong>${t.lane} 赛道 · ${esc(t.name)}</strong><small>${esc(teamStatus(t))}</small></div><span class="score">${displayedScore(t)}</span><button class="btn danger" data-dnf="${esc(t.id)}" ${!(['pending','fault_pending'].includes(t.status)&&e.phase==='live')?'disabled':''}>未完成</button></div>`).join('')}</div><p class="tiny-note">只有正式未完成、未到场的队伍才应标记为0分；临时硬件故障应走补赛流程。</p></section>
 <section class="panel"><div class="panel-head"><span class="panel-title">故障顺延补赛</span><span class="eyebrow">ONE RETRY ONLY</span></div>${faults.length?faults.map(t=>`<div class="team-entry"><div><strong>${esc(t.name)}</strong><small>${esc(teamStatus(t))} · ${t.lane}赛道</small></div><span class="muted">${t.attempt_count}/2</span><button class="btn" data-retry="${esc(t.id)}" ${e.phase!=='retry'||e.active_retry_team||t.status!=='fault_pending'?'disabled':''}>安排补赛</button></div>`).join(''):'<p class="subtext">暂无等待顺延补赛的队伍。</p>'}${e.active_retry_team?`<div class="btns" style="margin-top:14px"><button class="btn danger" id="retryFail">当前补赛未完成 · 记0分</button></div>`:''}</section></div>
 <div class="flex-col"><section class="panel"><div class="panel-head"><span class="panel-title">大屏即时广播</span><span class="eyebrow">ANNOUNCEMENT</span></div><p class="subtext">当前广播：${esc(e.announcement)}</p><form id="announceForm"><div class="field"><label>大屏显示的现场提示</label><input type="text" id="announceInput" maxlength="100" required placeholder="如：请第6轮队伍前往赛道准备"></div><button class="btn block" style="margin-top:12px">发布大屏提示</button></form><div class="btns" style="margin-top:13px"><button class="btn" id="fullscreenBtn">⛶ 大屏全屏</button><button class="btn" id="judgeShortcut">↗ 裁判台</button></div></section>
 <section class="panel"><div class="panel-head"><span class="panel-title">奖项核定与揭晓</span><span class="eyebrow">AWARDS RELEASE</span></div><div class="value-select"><div class="award-chip">一等奖 <strong>03</strong> 队</div><div class="award-chip">二等奖 <strong>07</strong> 队</div><div class="award-chip">三等奖 <strong>08</strong> 队</div></div><p class="tiny-note">按最终成绩降序分配。第3/4、10/11、18/19名若同分，必须先按已公布赛制由裁判录入裁决顺序，才允许揭晓。</p>${e.phase==='review'?`<div class="editor-notice">${allScored?'所有36队已有成绩，可以进行奖项边界同分核查。':'还有队伍未完成成绩确认，不能公布。'}</div><button id="revealButton" class="btn lime big block" style="margin-top:15px" ${!allScored?'disabled':''}>★ 一键公布获奖名单（全大屏联动）</button>`:e.awards_revealed?'<button class="btn lime block" id="openAwards">★ 播放颁奖动画</button>':'<p class="subtext">完成18轮正赛和补赛后自动开放。</p>'}</section>
 <section class="panel"><div class="panel-head"><span class="panel-title">成绩排行榜 · 同分裁决</span><span class="eyebrow">FINAL CHECK</span></div><div class="ranking-list" style="max-height:370px;overflow:auto">${ranked.map((t,i)=>`<div class="rank-item ${i===0?'top1':''}"><span class="rank-no">${pad(i+1)}</span><span class="rank-name">${esc(t.name)}</span><span class="rank-score">${displayedScore(t)}</span></div>`).join('')||'<p class="subtext">暂无分数</p>'}</div>${e.phase==='review'?`<form id="tieForm" style="margin-top:17px"><div class="form-grid"><div class="field"><label>同分队伍</label><select id="tieTeam">${ranked.map(t=>`<option value="${esc(t.id)}">${esc(t.name)} (${displayedScore(t)})</option>`).join('')}</select></div><div class="field"><label>裁判裁决序（数值越小优先）</label><input id="tieNumber" type="number" min="1" max="36" placeholder="1"></div></div><button type="submit" class="btn block" style="margin-top:12px">保存裁决序</button></form>`:''}</section><button class="btn ghost" id="logoutBtn">退出总控账号</button></div></div>${footer()}`;
}
function render(){if(!state.event)return;const el=$('app');el.innerHTML=state.view==='screen'?screen():state.view==='judge'?judge():control();bindEvents();tick();}
async function execute(action,data,success='操作成功'){try{await rpc(action,data);toast(success);await refresh(true)}catch(e){toast(e.message,true)}}
function bindEvents(){
 $('openFullscreen')?.addEventListener('click',()=>document.documentElement.requestFullscreen?.().catch(()=>toast('请通过浏览器菜单启用全屏',true)));
 $('fullscreenBtn')?.addEventListener('click',()=>setView('screen'));
 $('judgeShortcut')?.addEventListener('click',()=>setView('judge'));
 $('openAwards')?.addEventListener('click',showAwards);
 $('logoutBtn')?.addEventListener('click',()=>{state.token='';state.role='';sessionStorage.removeItem('comp26_token');sessionStorage.removeItem('comp26_role');render()});
 $('authForm')?.addEventListener('submit',async ev=>{ev.preventDefault();const token=$('accessCode').value.trim();const old=state.token;state.token=token;try{const probe=await rpc('probe');state.role=probe.role;sessionStorage.setItem('comp26_token',token);sessionStorage.setItem('comp26_role',probe.role);toast('验证成功：'+roleText[probe.role]);render()}catch(e){state.token=old;toast(e.message,true)}});
 $('scoreForm')?.addEventListener('submit',async ev=>{ev.preventDefault();const team=state.teams.find(t=>t.id===$('currentTeamId').value);const score=Number($('scoreInput').value);const note=$('scoreNote').value.trim();if(!Number.isFinite(score)||score<0||score>9999){toast('分数必须在0—9999之间',true);return}if(confirm(`确认提交？\n队伍：${team.name}\n赛道：${team.lane}\n最终成绩：${score.toFixed(2)} 分\n\n提交后实时显示于大屏。`))await execute('submit',{p_team_id:team.id,p_score:score,p_note:note},'成绩已提交 · 大屏同步更新')});
 $('faultBtn')?.addEventListener('click',async()=>{const t=state.teams.find(t=>t.id===$('currentTeamId').value);if(confirm(`确定申报 ${t.name} 的临时硬件故障？\n确认后该队将顺延至补赛时段，每队仅允许一次补赛。`))await execute('fault',{p_team_id:t.id,p_note:'临时硬件故障 · 现场裁判确认'},'已加入故障补赛队列')});
 document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',async()=>{const act=b.dataset.action;if(confirm(act==='start'?'确定宣布赛事正式开始？':act==='next'?'本轮双赛道成绩已确认，确定有请下一轮队伍？':'所有故障队伍均已处理，进入成绩核对？') )await execute(act,{},'比赛进程已同步到全场大屏')}));
 document.querySelectorAll('[data-dnf]').forEach(b=>b.addEventListener('click',()=>{const t=state.teams.find(x=>x.id===b.dataset.dnf);if(confirm('请核实：将 '+t.name+' 标记为未完成（0分），此操作会计入最终排名。'))execute('mark_dnf',{p_team_id:t.id},'已记录为未完成')}));
 document.querySelectorAll('[data-retry]').forEach(b=>b.addEventListener('click',()=>{const t=state.teams.find(x=>x.id===b.dataset.retry);if(confirm('安排 '+t.name+' 进行唯一一次补赛？'))execute('activate_retry',{p_team_id:t.id},'补赛通知已同步至赛道')}));
 $('retryFail')?.addEventListener('click',()=>{if(confirm('补赛未完成将记为0分。确定？'))execute('retry_fail',{p_team_id:state.event.active_retry_team},'补赛结果已登记')});
 $('announceForm')?.addEventListener('submit',ev=>{ev.preventDefault();execute('announce',{p_note:$('announceInput').value.trim()},'现场广播已更新')});
 $('tieForm')?.addEventListener('submit',ev=>{ev.preventDefault();const n=$('tieNumber').value;execute('tie',{p_team_id:$('tieTeam').value,p_tie:n?Number(n):null},'同分裁决序已保存')});
 $('revealButton')?.addEventListener('click',async()=>{if(confirm('确认所有36支队伍的成绩和同分裁决均已核对？\n发布后将向所有大屏公布一等奖3队、二等奖7队、三等奖8队。')){await execute('reveal',{},'获奖名单已正式发布！');if(state.event.awards_revealed)showAwards()}});
}
function tick(){ $('clock').textContent=nowTime();const timer=$('roundTimer');if(timer&&state.event?.round_started_at&&state.event.phase==='live'){const elapsed=Math.floor((Date.now()-new Date(state.event.round_started_at).getTime())/1000);const remain=Math.max(0,240-elapsed);timer.textContent=pad(Math.floor(remain/60))+':'+pad(remain%60);timer.style.color=remain===0?'var(--orange)':'';}else if(timer)timer.textContent='04:00';}
let awardTimers=[];function showAwards(){if(!state.event?.awards_revealed){toast('奖项尚未由管理员正式公布',true);return;}sessionStorage.removeItem('comp26_skip_awards');state.awardOpened=true;const el=$('awardOverlay');el.classList.remove('hidden');awardTimers.forEach(clearTimeout);awardTimers=[];const r=sortRank();const prizes=[{n:3,label:'三等奖',list:r.slice(10,18),cls:''},{n:2,label:'二等奖',list:r.slice(3,10),cls:''},{n:1,label:'一等奖',list:r.slice(0,3),cls:'first'}];
 const content=$('awardContent');content.innerHTML='<div class="award-kicker">2026 MOVE ARENA · AWARD CEREMONY</div><h1 class="award-heading">荣誉即将揭晓</h1><div class="countdown-num">3</div>';
 for(let i=2;i>=1;i--)awardTimers.push(setTimeout(()=>{content.innerHTML='<div class="award-kicker">THE MOMENT OF GLORY</div><h1 class="award-heading">最终获奖名单</h1><div class="countdown-num">'+i+'</div>'},(3-i)*1100));
 awardTimers.push(setTimeout(()=>{content.innerHTML=`<div class="award-kicker">HONOR · EXCELLENCE · INNOVATION</div><h1 class="award-heading">荣誉时刻 · 获奖揭晓</h1><p class="subtext" style="margin-bottom:30px">一等奖3队 · 二等奖7队 · 三等奖8队 / 按正式最终成绩排序</p><div class="award-podium">${prizes.map(g=>`<section class="award-group ${g.cls}"><div class="big-number">0${g.n}</div><h3>${g.label} <small>/ ${g.list.length}支队伍</small></h3>${g.list.map(t=>`<p>${esc(t.name)} <b>${displayedScore(t)}</b><small> 分</small></p>`).join('')}</section>`).join('')}</div><p class="subtext" style="margin-top:28px">感谢参赛同学、指导老师、裁判及全体工作人员。科技创新，精彩继续！</p>`;},3300));
}
$('closeAwards').addEventListener('click',()=>{$('awardOverlay').classList.add('hidden');awardTimers.forEach(clearTimeout);sessionStorage.setItem('comp26_skip_awards','1')});
document.querySelectorAll('[data-nav]').forEach(btn=>btn.addEventListener('click',()=>setView(btn.dataset.nav)));
window.addEventListener('hashchange',()=>{const hash=location.hash.replace('#','');if(hash&&hash!==state.view)setView(hash)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('awardOverlay').classList.contains('hidden'))$('closeAwards').click();if(e.key==='F11')return; if(e.key.toLowerCase()==='f'&&!['input','textarea'].includes(document.activeElement?.tagName?.toLowerCase())&&state.view==='screen')document.documentElement.requestFullscreen?.().catch(()=>{})});
setView(location.hash.slice(1)||'screen');refresh(true);setInterval(()=>refresh(false),Math.max(1500,C.pollingMs));setInterval(tick,1000);
})();
</script>
</body></html>
