/* === Audience broadcast layout: fixed one-viewport board, no projector scrolling === */
body[data-view="screen"]{height:100dvh;overflow:hidden;display:flex;flex-direction:column}
body[data-view="screen"] .topbar{flex:0 0 70px;height:70px;padding:0 clamp(13px,2vw,28px);position:relative}
body[data-view="screen"] .brand{min-width:0}
body[data-view="screen"] .brand-icon{width:38px;height:38px;font-size:28px}
body[data-view="screen"] .brand-lines strong{font-size:24px}
body[data-view="screen"] .brand-lines small{font-size:9px}
body[data-view="screen"] .nav button{padding:9px 12px;font-size:11px}
body[data-view="screen"] .shell{width:100%;max-width:none;height:calc(100dvh - 70px);min-height:0;flex:1;padding:12px clamp(12px,1.5vw,25px) 10px;overflow:hidden}
body[data-view="screen"][data-display="1"] .nav{display:none}
body[data-view="screen"][data-display="1"] .top-right{margin-left:auto}
.arena-overview{height:100%;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) 25px;gap:11px;color:#ebf8fa}
.arena-heading{display:flex;align-items:center;justify-content:space-between;min-width:0;gap:18px}
.arena-kicker{display:block;font:800 10px var(--font-display);letter-spacing:2px;color:#50dbc9}
.arena-heading-title h1{font-size:clamp(20px,2vw,35px);font-weight:900;letter-spacing:-1px;line-height:1.15;margin:4px 0}
.arena-heading-title h1 em{font-style:normal;color:#75f4d2}
.arena-summary{display:flex;align-items:center;justify-content:flex-end;gap:17px;white-space:nowrap}
.arena-summary>span{display:flex;align-items:baseline;gap:5px}
.arena-summary b{font:900 29px var(--font-display);color:#e9faff}
.arena-summary small{font-size:10px;color:#8fb3c1}
.arena-summary .arena-phase{padding:7px 11px;border:1px solid #2d695e;border-radius:6px;background:#123f43;font-size:12px;font-weight:800;color:#6bffe1;align-items:center;gap:8px}
.arena-live-dot{display:inline-block;width:7px;height:7px;background:#5effe0;border-radius:50%;box-shadow:0 0 13px #5effe0;flex:none}
.arena-summary .arena-fault b{color:#ffad83}
.arena-main{min-height:0;display:grid;grid-template-columns:minmax(0,.94fr) minmax(0,1.06fr);gap:13px}
.arena-stage{min-width:0;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto auto auto;gap:10px}
.arena-stage-current,.arena-next,.arena-leaderboard{min-width:0;border:1px solid #254657;border-radius:12px;background:linear-gradient(150deg,#123049 0%,#101f32 78%);overflow:hidden}
.arena-stage-current{display:flex;flex-direction:column;min-height:0}
.arena-stage-top{padding:clamp(11px,1.5vh,22px) clamp(16px,1.5vw,25px);display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #2a4758}
.arena-section-label{font:800 12px var(--font-display);letter-spacing:1.8px;color:#5effe0}
.arena-stage-round{font:900 clamp(55px,7.5vh,110px)/1 var(--font-display);letter-spacing:-1px;color:#5effe0;margin-top:4px}
.arena-stage-round span{font:800 15px 'Noto Sans SC',sans-serif;letter-spacing:0;color:#a4c8d3}
.arena-clock-box{text-align:right;flex:none}
.arena-clock-box>span{font-size:11px;color:#95b6c4}
.arena-clock-box strong{display:block;font:900 clamp(36px,5.8vh,72px)/1.08 var(--font-display);letter-spacing:1px;color:#e9fafc}
.arena-stage-lanes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));flex:1;min-height:0}
.arena-lane{min-width:0;padding:clamp(10px,1.4vh,21px) clamp(12px,1.4vw,24px);display:flex;flex-direction:column;justify-content:space-between;gap:9px}
.arena-lane+.arena-lane{border-left:1px solid #285267}
.arena-lane-id{font:900 clamp(24px,3vw,41px)/1 var(--font-display);color:#5effe0;display:flex;align-items:baseline;gap:8px}
.arena-lane-id i{font:800 10px 'Noto Sans SC',sans-serif;color:#a5c6d1;font-style:normal}
.arena-lane-b .arena-lane-id{color:#ddf889}
.arena-lane-name{font-size:clamp(18px,1.8vw,30px);line-height:1.28;overflow-wrap:anywhere;min-height:0;display:flex;align-items:center;flex:1}
.arena-lane-bottom{display:flex;justify-content:space-between;align-items:center;gap:7px;flex-wrap:wrap}
.arena-lane-status{font-size:10px;color:#9cc3d0;border-radius:4px;border:1px solid #3a6171;background:#1c3b4b;padding:5px 7px}
.arena-lane-result{font:900 clamp(23px,2.7vw,42px)/1 var(--font-display);color:#e4f78b;white-space:nowrap}
.arena-lane-result small{font:700 10px 'Noto Sans SC',sans-serif;color:#98afc3}
.arena-stage-hint{flex:none;padding:10px clamp(12px,1.4vw,24px);font-size:12px;font-weight:700;background:#14444b80;color:#d3fff4;border-top:1px solid #32616c}
.arena-next{padding:clamp(11px,1.4vh,18px) clamp(14px,1.4vw,22px);background:linear-gradient(140deg,#182e41,#101f32)}

<script>/* MOVE.ARENA · 独立比赛直播应用。无第三方 JS 依赖；与主站完全隔离。 */
(() => {
'use strict';
const C = window.COMP26_CONFIG;
const SLUG = C.slug;
const demoMode = new URLSearchParams(location.search).has('demo');
const displayOnly = new URLSearchParams(location.search).has('display');
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const nowTime = ()=>new Date().toLocaleTimeString('zh-CN',{hour12:false});
const phaseText={upcoming:'等待开赛',live:'比赛进行中',retry:'故障顺延补赛',review:'成绩复核中',awards:'颁奖进行中',closed:'比赛结束'};
const state={view:'screen',event:null,teams:[],role:sessionStorage.getItem('comp26_role_v2')||'',token:sessionStorage.getItem('comp26_token_v2')||'',lastSnapshot:'',loading:false,pollError:false,lastUpdate:0,awardOpened:false,demo:demoMode};
const toast=(msg,bad=false)=>{const el=$('message');el.textContent=msg;el.className='toast visible'+(bad?' bad':'');clearTimeout(window._toastTimeout);window._toastTimeout=setTimeout(()=>el.classList.remove('visible'),4000)};
const roleText = {admin:'赛事总管理员',judge_a:'A赛道裁判',judge_b:'B赛道裁判'};
const req=async(path,options={})=>{
 const response=await fetch(C.projectUrl+'/rest/v1/'+path,{...options,headers:{apikey:C.publishableKey,...options.headers}});
 const body=await response.text();let json;try{json=body?JSON.parse(body):null}catch{json=body}
 if(!response.ok)throw Error(json?.message||json?.hint||JSON.stringify(json)||'网络请求失败');return json;
};
const rpc=async(action,data={})=>{
 if(demoMode)return demoAction(action,data);
 if(!state.token)throw Error('请先输入裁判或管理员访问码');
 return req('rpc/comp26_action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({p_secret:state.token,p_action:action,...data})});
};
function prepareDemo(){
 const existing=localStorage.getItem('comp26_demo');
 if(existing){try{const x=JSON.parse(existing);if(x.teams?.length===36){state.event=x.event;state.teams=x.teams;return;}}catch{}}
 state.event={id:'demo',current_round:4,phase:'live',awards_revealed:false,active_retry_team:null,announcement:'有请第4轮：宝宝巴士、迅风小队！',round_started_at:new Date().toISOString()};
 state.teams=window.COMP26_TEAMS.map((t,i)=>({...t,id:'team-'+(i+1),draw_order:t.order,round_no:t.round,lane:t.lane,status:i<6?'scored':'pending',score:i<6?Number((80+(i*7)%18+(i*.23)).toFixed(2)):null,attempt_count:1,tie_order:null,note:''}));
 localStorage.setItem('comp26_demo',JSON.stringify({event:state.event,teams:state.teams}));
}
function persistDemo(){localStorage.setItem('comp26_demo',JSON.stringify({event:state.event,teams:state.teams}))}
function demoAction(action,d={}){
 const e=state.event,t=state.teams.find(x=>x.id===d.p_team_id);const err=m=>{throw Error(m)};
 if(action==='probe')return {ok:true,role:state.role||'admin'};
 if(action==='start'){e.phase='live';e.current_round=1;e.round_started_at=new Date().toISOString();state.teams.forEach(x=>{x.status='pending';x.score=null;x.attempt_count=1})}
 else if(action==='submit'){if(!t)err('队伍不存在');t.score=Number(d.p_score);t.status=e.phase==='retry'?'retry_scored':'scored';t.note=d.p_note||'';if(e.phase==='retry')e.active_retry_team=null}
 else if(action==='fault'){if(!t)err('队伍不存在');t.status='fault_pending';t.note=d.p_note||'硬件临时故障'}
 else if(action==='mark_dnf'||action==='retry_fail'){t.score=0;t.status='dnf';e.active_retry_team=null}
 else if(action==='next'){const pending=state.teams.filter(x=>x.round_no===e.current_round&&!['scored','fault_pending','dnf'].includes(x.status));if(pending.length)err('本轮仍有未确认队伍');if(e.current_round<18){e.current_round++;e.announcement='有请第'+e.current_round+'轮！';e.round_started_at=new Date().toISOString()}else{e.phase=state.teams.some(x=>x.status==='fault_pending')?'retry':'review';e.announcement='正赛结束，进入成绩核对'}}
 else if(action==='activate_retry'){t.status='retry_active';t.attempt_count=2;e.active_retry_team=t.id;e.announcement='补赛：'+t.name}
 else if(action==='finish_retries'){e.phase='review';e.announcement='正在核对获奖名单'}
 else if(action==='tie'){t.tie_order=d.p_tie}
 else if(action==='reveal'){if(state.teams.some(x=>x.score===null))err('请完成所有队伍评分');e.phase='awards';e.awards_revealed=true;e.announcement='获奖名单正式揭晓！'}
 else if(action==='announce'){e.announcement=d.p_note}
 persistDemo();return {ok:true};
}
async function refresh(force=false){
 if(state.loading)return;state.loading=true;
 try{
  if(demoMode){if(!state.event)prepareDemo();}
  else{
   const events=await req('comp26_events?select=*&slug=eq.'+encodeURIComponent(SLUG));

 <div class="flex-col"><section class="panel"><div class="panel-head"><span class="panel-title">大屏即时广播</span><span class="eyebrow">ANNOUNCEMENT</span></div><p class="subtext">当前广播：${esc(e.announcement)}</p><form id="announceForm"><div class="field"><label>大屏显示的现场提示</label><input type="text" id="announceInput" maxlength="100" required placeholder="如：请第6轮队伍前往赛道准备"></div><button class="btn block" style="margin-top:12px">发布大屏提示</button></form><div class="btns" style="margin-top:13px"><button class="btn" id="fullscreenBtn">⛶ 大屏全屏</button><button class="btn" id="judgeShortcut">↗ 裁判台</button></div></section>
 <section class="panel"><div class="panel-head"><span class="panel-title">奖项核定与揭晓</span><span class="eyebrow">AWARDS RELEASE</span></div><div class="value-select"><div class="award-chip">一等奖 <strong>03</strong> 队</div><div class="award-chip">二等奖 <strong>07</strong> 队</div><div class="award-chip">三等奖 <strong>08</strong> 队</div></div><p class="tiny-note">按最终成绩降序分配。第3/4、10/11、18/19名若同分，必须先按已公布赛制由裁判录入裁决顺序，才允许揭晓。</p>${e.phase==='review'?`<div class="editor-notice">${allScored?'所有36队已有成绩，可以进行奖项边界同分核查。':'还有队伍未完成成绩确认，不能公布。'}</div><button id="revealButton" class="btn lime big block" style="margin-top:15px" ${!allScored?'disabled':''}>★ 一键公布获奖名单（全大屏联动）</button>`:e.awards_revealed?'<button class="btn lime block" id="openAwards">★ 播放颁奖动画</button>':'<p class="subtext">完成18轮正赛和补赛后自动开放。</p>'}</section>
 <section class="panel"><div class="panel-head"><span class="panel-title">成绩排行榜 · 同分裁决</span><span class="eyebrow">FINAL CHECK</span></div><div class="ranking-list" style="max-height:370px;overflow:auto">${ranked.map((t,i)=>`<div class="rank-item ${i===0?'top1':''}"><span class="rank-no">${pad(i+1)}</span><span class="rank-name">${esc(t.name)}</span><span class="rank-score">${displayedScore(t)}</span></div>`).join('')||'<p class="subtext">暂无分数</p>'}</div>${e.phase==='review'?`<form id="tieForm" style="margin-top:17px"><div class="form-grid"><div class="field"><label>同分队伍</label><select id="tieTeam">${ranked.map(t=>`<option value="${esc(t.id)}">${esc(t.name)} (${displayedScore(t)})</option>`).join('')}</select></div><div class="field"><label>裁判裁决序（数值越小优先）</label><input id="tieNumber" type="number" min="1" max="36" placeholder="1"></div></div><button type="submit" class="btn block" style="margin-top:12px">保存裁决序</button></form>`:''}</section><button class="btn ghost" id="logoutBtn">退出总控账号</button></div></div>${footer()}`;
}
function render(){if(!state.event)return;const el=$('app');el.innerHTML=state.view==='screen'?screen():state.view==='judge'?judge():control();bindEvents();tick();}
async function execute(action,data,success='操作成功'){try{await rpc(action,data);toast(success);await refresh(true)}catch(e){toast(e.message,true)}}
function bindEvents(){
 $('openFullscreen')?.addEventListener('click',()=>document.documentElement.requestFullscreen?.().catch(()=>toast('请通过浏览器菜单启用全屏',true)));
 $('fullscreenBtn')?.addEventListener('click',()=>setView('screen'));
 $('judgeShortcut')?.addEventListener('click',()=>setView('judge'));
 $('openAwards')?.addEventListener('click',showAwards);
 $('logoutBtn')?.addEventListener('click',()=>{state.token='';state.role='';for(const k of ['comp26_token','comp26_role','comp26_token_v2','comp26_role_v2'])sessionStorage.removeItem(k);render()});
 $('authForm')?.addEventListener('submit',async ev=>{ev.preventDefault();const code=$('accessCode').value.trim();const selected=$('accessRole').value;if(!/^[0-9]{6}$/.test(code)||!roleText[selected]){toast('请正确选择身份并填写6位数字访问码',true);return;}const token='MOVE.ARENA:2026:'+selected+':'+code;const old=state.token,oldRole=state.role;state.token=token;state.role=selected;try{const probe=await rpc('probe');if(probe.role!==selected)throw Error('身份验证不一致，请联系管理员');state.role=probe.role;sessionStorage.setItem('comp26_token_v2',token);sessionStorage.setItem('comp26_role_v2',probe.role);toast('验证成功：'+roleText[probe.role]);render()}catch(e){state.token=old;state.role=oldRole;toast(e.message,true)}});
 $('scoreForm')?.addEventListener('submit',async ev=>{ev.preventDefault();const team=state.teams.find(t=>t.id===$('currentTeamId').value);const score=Number($('scoreInput').value);const note=$('scoreNote').value.trim();if(!Number.isFinite(score)||score<0||score>9999){toast('分数必须在0—9999之间',true);return}if(confirm(`确认提交？\n队伍：${team.name}\n赛道：${team.lane}\n最终成绩：${score.toFixed(2)} 分\n\n提交后实时显示于大屏。`))await execute('submit',{p_team_id:team.id,p_score:score,p_note:note},'成绩已提交 · 大屏同步更新')});
 $('faultBtn')?.addEventListener('click',async()=>{const t=state.teams.find(t=>t.id===$('currentTeamId').value);if(confirm(`确定申报 ${t.name} 的临时硬件故障？\n确认后该队将顺延至补赛时段，每队仅允许一次补赛。`))await execute('fault',{p_team_id:t.id,p_note:'临时硬件故障 · 现场裁判确认'},'已加入故障补赛队列')});
 document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',async()=>{const act=b.dataset.action;if(confirm(act==='start'?'确定宣布赛事正式开始？':act==='next'?'本轮双赛道成绩已确认，确定有请下一轮队伍？':'所有故障队伍均已处理，进入成绩核对？') )await execute(act,{},'比赛进程已同步到全场大屏')}));
 document.querySelectorAll('[data-dnf]').forEach(b=>b.addEventListener('click',()=>{const t=state.teams.find(x=>x.id===b.dataset.dnf);if(confirm('请核实：将 '+t.name+' 标记为未完成（0分），此操作会计入最终排名。'))execute('mark_dnf',{p_team_id:t.id},'已记录为未完成')}));
 document.querySelectorAll('[data-retry]').forEach(b=>b.addEventListener('click',()=>{const t=state.teams.find(x=>x.id===b.dataset.retry);if(confirm('安排 '+t.name+' 进行唯一一次补赛？'))execute('activate_retry',{p_team_id:t.id},'补赛通知已同步至赛道')}));
 $('retryFail')?.addEventListener('click',()=>{if(confirm('补赛未完成将记为0分。确定？'))execute('retry_fail',{p_team_id:state.event.active_retry_team},'补赛结果已登记')});
 $('announceForm')?.addEventListener('submit',ev=>{ev.preventDefault();execute('announce',{p_note:$('announceInput').value.trim()},'现场广播已更新')});
 $('tieForm')?.addEventListener('submit',ev=>{ev.preventDefault();const n=$('tieNumber').value;execute('tie',{p_team_id:$('tieTeam').value,p_tie:n?Number(n):null},'同分裁决序已保存')});
 $('revealButton')?.addEventListener('click',async()=>{if(confirm('确认所有36支队伍的成绩和同分裁决均已核对？\n发布后将向所有大屏公布一等奖3队、二等奖7队、三等奖8队。')){await execute('reveal',{},'获奖名单已正式发布！');if(state.event.awards_revealed)showAwards()}});
}
function tick(){ $('clock').textContent=nowTime();const timer=$('roundTimer');if(timer&&state.event?.round_started_at&&state.event.phase==='live'){const elapsed=Math.floor((Date.now()-new Date(state.event.round_started_at).getTime())/1000);const remain=Math.max(0,240-elapsed);timer.textContent=pad(Math.floor(remain/60))+':'+pad(remain%60);timer.style.color=remain===0?'var(--orange)':'';}else if(timer)timer.textContent=state.event?.phase==='upcoming'?'04:00':'--:--';}
let awardTimers=[];function showAwards(){if(!state.event?.awards_revealed){toast('奖项尚未由管理员正式公布',true);return;}sessionStorage.removeItem('comp26_skip_awards');state.awardOpened=true;const el=$('awardOverlay');el.classList.remove('hidden');awardTimers.forEach(clearTimeout);awardTimers=[];const r=sortRank();const prizes=[{n:3,label:'三等奖',list:r.slice(10,18),cls:''},{n:2,label:'二等奖',list:r.slice(3,10),cls:''},{n:1,label:'一等奖',list:r.slice(0,3),cls:'first'}];
 const content=$('awardContent');content.innerHTML='<div class="award-kicker">机械创新实验室 · 2026 AWARD CEREMONY</div><h1 class="award-heading">荣誉即将揭晓</h1><div class="countdown-num">3</div>';
 for(let i=2;i>=1;i--)awardTimers.push(setTimeout(()=>{content.innerHTML='<div class="award-kicker">THE MOMENT OF GLORY</div><h1 class="award-heading">最终获奖名单</h1><div class="countdown-num">'+i+'</div>'},(3-i)*1100));
 awardTimers.push(setTimeout(()=>{content.innerHTML=`<div class="award-kicker">HONOR · ENGINEERING · INNOVATION</div><h1 class="award-heading">机械创新 · 荣誉时刻</h1><p class="subtext" style="margin-bottom:30px">一等奖3队 · 二等奖7队 · 三等奖8队 / 按正式最终成绩排序</p><div class="award-podium">${prizes.map(g=>`<section class="award-group ${g.cls}"><div class="big-number">0${g.n}</div><h3>${g.label} <small>/ ${g.list.length}支队伍</small></h3>${g.list.map(t=>`<p>${esc(t.name)} <b>${displayedScore(t)}</b><small> 分</small></p>`).join('')}</section>`).join('')}</div><p class="subtext" style="margin-top:28px">感谢参赛同学、指导老师、裁判及全体工作人员。科技创新，精彩继续！</p>`;},3300));
}
$('closeAwards').addEventListener('click',()=>{$('awardOverlay').classList.add('hidden');awardTimers.forEach(clearTimeout);sessionStorage.setItem('comp26_skip_awards','1')});
document.querySelectorAll('[data-nav]').forEach(btn=>btn.addEventListener('click',()=>setView(btn.dataset.nav)));
window.addEventListener('hashchange',()=>{const hash=location.hash.replace('#','');if(hash&&hash!==state.view)setView(hash)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('awardOverlay').classList.contains('hidden'))$('closeAwards').click();if(e.key==='F11')return; if(e.key.toLowerCase()==='f'&&!['input','textarea'].includes(document.activeElement?.tagName?.toLowerCase())&&state.view==='screen')document.documentElement.requestFullscreen?.().catch(()=>{})});
setView(location.hash.slice(1)||'screen');refresh(true);setInterval(()=>refresh(false),Math.max(1500,C.pollingMs));setInterval(tick,1000);
})();
</script>
</body></html>
