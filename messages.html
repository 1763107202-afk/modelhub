<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>消息中心 | 江苏科技大学机械创新实验室</title>
<link data-cache-managed rel="stylesheet" href="./styles-v43.css">
<link data-cache-managed rel="stylesheet" href="./theme-v3.css">
<script src="./theme-init-v2.js?v=20260924-1910"></script>
</head>
<body data-page="messages">
<div id="siteHeader"></div>
<main class="messageCenterShell wrap" id="messageCenterShell">
  <div class="messageCenterHeading">
    <div><div class="eyebrow">MESSAGE CENTER</div><h1>消息中心</h1>
      <p>实验室公告、进度提醒与教师评语集中查看。打开消息不等于确认收到。</p>
    </div>
    <a class="btn sec" href="./notify-settings.html">通知设置 ↗</a>
  </div>
  <section class="messageCenterPanel">
    <div class="messageMainTabs" role="tablist" aria-label="消息类别">
      <button type="button" class="isActive" data-message-tab="inbox" role="tab" aria-selected="true" aria-controls="messageInboxPanel">收到的消息 <span id="messageInboxCount"></span></button>
      <button type="button" data-message-tab="sent" role="tab" aria-selected="false" aria-controls="messageSentPanel">已发送 <span id="messagePendingCount"></span></button>
    </div>
    <div id="messageInboxPanel" role="tabpanel" aria-label="收到的消息">
      <div id="messageFilterBar" class="messageFilterBar" role="group" aria-label="筛选收到的消息">
        <button type="button" data-message-filter="all" class="isActive" aria-pressed="true">全部</button>
        <button type="button" data-message-filter="unread" aria-pressed="false">未读</button>
        <button type="button" data-message-filter="teacher" aria-pressed="false">教师通知</button>
        <button type="button" data-message-filter="system" aria-pressed="false">系统通知</button>
        <button type="button" data-message-filter="ack" aria-pressed="false">确认反馈</button>
      </div>
      <div id="messageInboxMount"><p class="messageLoading">正在加载通知…</p></div>
    </div>
    <div id="messageSentPanel" role="tabpanel" aria-label="已发送的提醒和评语" hidden>
      <div class="messageSentLegend">确认收到由接收人主动点击记录，不能用已读或微信接口接受代替。</div>
      <div class="messageSentFilters" role="group" aria-label="筛选已发送消息"><button type="button" class="isActive" data-sent-filter="all" aria-pressed="true">全部</button><button type="button" data-sent-filter="pending" aria-pressed="false">待确认</button><button type="button" data-sent-filter="acknowledged" aria-pressed="false">已确认</button></div>
      <p id="messageSentSummary" class="messageSentSummary" role="status" aria-live="polite"></p>
      <div id="messageSentList" class="messageSentList"><p class="messageLoading">正在查询已发送消息…</p></div>
    </div>
  </section>
  <p class="messageRetentionHint">消息中心展示最近的通知记录；教师定向通知的确认及回执仅向有关的接收人与发送人开放。</p>
</main>
<div id="siteFooter"></div>
<script src="./cache-loader.js?v=2026.10.23.mobile-ux41"></script>
</body>
</html>
