<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>提交作业 | 江苏科技大学机械创新实验室交流平台</title><link rel="stylesheet" href="./styles-v42.css"></head><body data-page="submit"><div id="siteHeader"></div><main id="submitMain"><section class="pageHero wrap"><span class="eyebrow">SUBMISSION</span><h1>提交建模文件</h1><p>提交逻辑与管理员发布任务一致：先校验，再上传文件，最后写入提交记录。</p></section><section class="section wrap"><div id="pageGate"></div><div id="submitCountCard" class="submitCountCard hidden"><div><span>当前任务已提交人数</span><b id="submitterCount">0</b><small>人</small></div><p id="submitCountHint">选择任务后显示去重后的已提交人数。</p></div><form id="subForm" class="form glass hidden" novalidate onsubmit="return false;"><div class="two"><label>对应试卷 / 任务<select id="examSel"><option value="">正在加载任务…</option></select></label><label>姓名 / 队伍名称<input id="submitName" maxlength="80" placeholder="请输入姓名或队伍名称"></label></div><label>备注<textarea id="note" rows="3" maxlength="500" placeholder="可填写版本说明、队伍成员等"></textarea></label><label class="drop"><input id="subFile" type="file" accept=".zip,.rar,.7z"><strong id="fileText">点击选择建模压缩包</strong><small>支持 ZIP / RAR / 7Z</small></label><div class="submitActions"><button id="submitBtn" class="btn pri" type="button">提交文件</button><span id="submitStatus" class="submitStatus"></span></div></form></section></main><div id="siteFooter"></div><script type="module" src="./app-v43.js"></script></body></html>
